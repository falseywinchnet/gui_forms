# GUI.Forms Linux validation VM: Alpine 3.24 aarch64 (musl), Apple
# Virtualization framework, headless X11/Wayland for graphical tests.
# Reconstructed 2026-10-11 from the lost `gui-forms-linux` (Lima) and
# `paint-builder` (QEMU Alpine) VMs; see README.md for the provenance.
#
#   limactl create --name=gui-forms-linux tools/linux_vm/gui-forms-linux.yaml
#   limactl start gui-forms-linux
minimumLimaVersion: 2.0.0
vmType: vz
arch: aarch64
images:
- location: "https://dl-cdn.alpinelinux.org/alpine/v3.24/releases/cloud/alpine-3.24.2-aarch64-cloudinit-r2.qcow2"
  arch: "aarch64"
  digest: "sha512:7ff4944380af149f747101516fa466ac601210caa84c667792220c187695aad24ca4531f397159c449c9e8a2ad76f6a2d9395d7f4d566e59bf925e35b186ba88"
cpus: 4
memory: 4GiB
disk: 24GiB
# Source arrives read-only from the host's build mirrors; build outputs stay
# inside the guest (~/build) so the host tree is never written.
mounts:
- location: "{{.Home}}/Developer/CodexBuilds"
  mountPoint: /mnt/codexbuilds
  writable: false
mountType: virtiofs
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/sh
    set -eu
    apk update
    # Toolchain: GUI.Forms requires Clang 22.1.x. Alpine 3.24 ships 22.1.3.
    apk add --no-cache build-base linux-headers git bash python3 pkgconf \
      cmake samurai ccache gn clang22 lld22
    # X11/accessibility development headers used by the Linux host.
    apk add --no-cache libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
      libxfixes-dev at-spi2-core-dev
    # Headless graphical testing: X server, Wayland compositor with
    # XWayland, a window manager for focus, inspection and capture tools.
    apk add --no-cache xvfb xauth xdg-utils weston weston-backend-headless \
      weston-xwayland xwayland dwm xdotool xprop xwininfo xwd
probes:
- mode: readiness
  description: GUI.Forms build and test tools installed
  script: |
    #!/bin/sh
    set -eu
    command -v clang-22 >/dev/null || test -x /usr/lib/llvm22/bin/clang
    command -v Xvfb >/dev/null
    command -v cmake >/dev/null
