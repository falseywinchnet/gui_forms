<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GUI.Forms layout fixture</title>
<style>
/* The reset every fixture is laid out under (PLAN.md section 6.4). GUI.Forms
   sizes are border boxes and controls carry no default margins in the
   corpus, so both are made explicit here. Borders are paint in GUI.Forms
   and stay zero. */
@@FONT_FACES@@
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: "Carlito";
  font-size: 13px;
  line-height: normal;
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0 solid transparent;
}
/* The fixture's root fills the viewport, as a GUI.Forms window's root
   control fills its client area. */
body > [data-gf-kind] {
  width: 100%;
  height: 100%;
}
</style>
</head>
<body>
@@FIXTURE@@
</body>
</html>
