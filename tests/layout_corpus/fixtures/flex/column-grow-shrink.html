<!-- A column grows into the height and shrinks overflowing items. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; flex-direction: column; align-items: flex-start">
  <div data-gf-id="item-0" data-gf-kind="box" style="flex-grow: 1; width: 60px; height: 30px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="width: 100px; height: 300px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="flex-grow: 2; width: 40px; height: 20px"></div>
</div>
