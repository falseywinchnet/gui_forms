<!-- Nested containers size from their content. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; flex-direction: column; align-items: flex-start; row-gap: 4px">
  <div data-gf-id="row" data-gf-kind="flex-layout-panel"
       style="display: flex; column-gap: 6px">
    <div data-gf-id="row-item-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
    <div data-gf-id="row-item-1" data-gf-kind="box" style="width: 60px; height: 30px"></div>
    <div data-gf-id="row-item-2" data-gf-kind="box" style="width: 30px; height: 25px"></div>
  </div>
  <div data-gf-id="column" data-gf-kind="flex-layout-panel"
       style="display: flex; flex-direction: column; row-gap: 3px">
    <div data-gf-id="column-item-0" data-gf-kind="box" style="width: 50px; height: 20px"></div>
    <div data-gf-id="column-item-1" data-gf-kind="box" style="width: 80px; height: 15px"></div>
  </div>
  <div data-gf-id="tail" data-gf-kind="box" style="width: 100px; height: 10px"></div>
</div>
