<!-- Percentage and calc() widths resolve against the content box. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; align-items: flex-start; padding: 10px">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 30%; flex-shrink: 0; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="width: calc(50% - 20px); flex-shrink: 0; height: 20px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="width: 12px; height: 20px"></div>
</div>
