<!-- An auto start margin pushes an item to the end; margin: auto centres one. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; align-items: flex-start">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 50px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="margin: auto; width: 50px; height: 20px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="margin-left: auto; width: 50px; height: 20px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="width: 50px; height: 20px"></div>
</div>
