<!-- min-height and max-height bound a column's items. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; flex-direction: column; align-items: flex-start">
  <div data-gf-id="item-0" data-gf-kind="box" style="flex-grow: 1; max-height: 60px; width: 50px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="flex-grow: 1; min-height: 80px; width: 50px; height: 10px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="flex-shrink: 1; width: 50px; height: 20px"></div>
</div>
