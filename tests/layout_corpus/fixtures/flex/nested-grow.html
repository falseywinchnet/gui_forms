<!-- A growing nested row distributes its own free space. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; align-items: flex-start">
  <div data-gf-id="lead" data-gf-kind="box" style="width: 50px; height: 40px"></div>
  <div data-gf-id="inner" data-gf-kind="flex-panel"
       style="display: flex; flex-grow: 1; padding: 4px; column-gap: 4px; align-items: center">
    <div data-gf-id="inner-item-0" data-gf-kind="box" style="flex-grow: 1; height: 20px"></div>
    <div data-gf-id="inner-item-1" data-gf-kind="box" style="width: 30px; height: 30px"></div>
    <div data-gf-id="inner-item-2" data-gf-kind="box" style="flex-grow: 2; height: 10px"></div>
  </div>
</div>
