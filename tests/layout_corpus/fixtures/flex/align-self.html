<!-- align-self overrides align-items per item. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; align-items: flex-start">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 50px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="align-self: center; width: 50px; height: 20px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="align-self: flex-end; width: 50px; height: 20px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="align-self: stretch; width: 50px"></div>
  <div data-gf-id="item-4" data-gf-kind="box" style="align-self: stretch; width: 50px; max-height: 100px"></div>
</div>
