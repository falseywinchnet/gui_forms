<!-- Negative free space: space-between falls back to start, space-around to center. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel"
     style="display: flex; flex-direction: column; align-items: flex-start">
  <div data-gf-id="between" data-gf-kind="flex-layout-panel"
       style="display: flex; justify-content: space-between; align-items: flex-start; height: 40px; flex-shrink: 0; width: 100%">
    <div data-gf-id="between-item-0" data-gf-kind="box" style="flex-shrink: 0; width: 500px; height: 20px"></div>
    <div data-gf-id="between-item-1" data-gf-kind="box" style="flex-shrink: 0; width: 500px; height: 20px"></div>
  </div>
  <div data-gf-id="around" data-gf-kind="flex-layout-panel"
       style="display: flex; justify-content: space-around; align-items: flex-start; height: 40px; flex-shrink: 0; width: 100%">
    <div data-gf-id="around-item-0" data-gf-kind="box" style="flex-shrink: 0; width: 500px; height: 20px"></div>
    <div data-gf-id="around-item-1" data-gf-kind="box" style="flex-shrink: 0; width: 500px; height: 20px"></div>
  </div>
</div>
