<!-- span n covers several tracks; auto-placement flows around them. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: repeat(4, 50px); grid-auto-rows: 25px; gap: 4px">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-column: span 2"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-row: span 2"></div>
  <div data-gf-id="item-3" data-gf-kind="box"></div>
  <div data-gf-id="item-4" data-gf-kind="box" style="grid-column: span 3"></div>
  <div data-gf-id="item-5" data-gf-kind="box"></div>
  <div data-gf-id="item-6" data-gf-kind="box"></div>
</div>
