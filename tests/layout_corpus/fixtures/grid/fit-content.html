<!-- fit-content() caps a column at its limit, or at its content when smaller. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: fit-content(100px) fit-content(300px) 1fr; grid-template-rows: 50px">
  <div data-gf-id="capped" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="capped-0" data-gf-kind="box" style="width: 60px; height: 20px"></div>
      <div data-gf-id="capped-1" data-gf-kind="box" style="width: 70px; height: 20px"></div>
      <div data-gf-id="capped-2" data-gf-kind="box" style="width: 50px; height: 20px"></div>
    </div>
  <div data-gf-id="content" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="content-0" data-gf-kind="box" style="width: 60px; height: 20px"></div>
      <div data-gf-id="content-1" data-gf-kind="box" style="width: 70px; height: 20px"></div>
    </div>
  <div data-gf-id="rest" data-gf-kind="box"></div>
</div>
