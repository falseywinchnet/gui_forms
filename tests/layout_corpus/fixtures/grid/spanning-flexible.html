<!-- A spanning item over a flexible column grows only the fraction. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 60px 1fr 2fr; grid-template-rows: 30px 30px; align-content: start">
  <div data-gf-id="a" data-gf-kind="box"></div>
  <div data-gf-id="b" data-gf-kind="box"></div>
  <div data-gf-id="c" data-gf-kind="box"></div>
  <div data-gf-id="wide" data-gf-kind="box" style="grid-column: 1 / 3; width: 400px"></div>
</div>
