<!-- justify-content: space-between places the columns in the width. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 60px 90px 50px; grid-template-rows: 30px; justify-content: space-between">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
</div>
