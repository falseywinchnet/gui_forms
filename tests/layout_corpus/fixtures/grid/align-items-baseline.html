<!-- Baseline-aligned items in a row line up their bottoms. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 80px 40px; align-items: baseline">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 30px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="width: 30px; height: 45px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="width: 30px; height: 30px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="width: 30px; height: 10px"></div>
  <div data-gf-id="item-4" data-gf-kind="box" style="width: 30px; height: 25px"></div>
  <div data-gf-id="item-5" data-gf-kind="box" style="width: 30px; height: 15px"></div>
</div>
