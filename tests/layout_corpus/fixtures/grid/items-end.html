<!-- justify-items and align-items: end size items from their content. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 120px 120px; grid-template-rows: 60px 60px; justify-items: end; align-items: end">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="width: 60px; height: 30px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="width: 80px; height: 10px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="width: 20px; height: 50px"></div>
</div>
