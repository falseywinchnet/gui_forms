<!-- An fr column keeps its content minimum, so the shares are unequal. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 40px">
  <div data-gf-id="wide" data-gf-kind="flex-panel"
         style="display: flex">
      <div data-gf-id="wide-0" data-gf-kind="box" style="width: 150px; height: 20px"></div>
      <div data-gf-id="wide-1" data-gf-kind="box" style="width: 140px; height: 20px"></div>
    </div>
  <div data-gf-id="narrow" data-gf-kind="box"></div>
</div>
