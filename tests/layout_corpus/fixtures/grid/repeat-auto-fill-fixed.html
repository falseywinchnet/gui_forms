<!-- As many 100 px columns as fit, the rest left over. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: repeat(auto-fill, 100px); grid-auto-rows: 24px; column-gap: 5px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
  <div data-gf-id="item-3" data-gf-kind="box"></div>
  <div data-gf-id="item-4" data-gf-kind="box"></div>
  <div data-gf-id="item-5" data-gf-kind="box"></div>
  <div data-gf-id="item-6" data-gf-kind="box"></div>
</div>
