<!-- A line before the explicit grid adds implicit tracks ahead of it. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 60px 60px; grid-template-rows: 30px; grid-auto-columns: 25px">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-column: -5 / -4"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-column: 1"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-column: 2"></div>
</div>
