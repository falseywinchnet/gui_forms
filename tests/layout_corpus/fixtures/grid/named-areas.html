<!-- grid-template-areas names the regions; grid-area places items in them. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 120px 1fr 100px; grid-template-rows: 40px 1fr 30px; grid-template-areas: 'head head head' 'nav main side' 'foot foot foot'">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-area: main"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-area: head"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-area: nav"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-area: side"></div>
  <div data-gf-id="item-4" data-gf-kind="box" style="grid-area: foot"></div>
</div>
