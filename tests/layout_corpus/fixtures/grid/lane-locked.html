<!-- Items with a row line only are placed along their row first. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: repeat(3, 50px); grid-auto-rows: 25px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-row: 2"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-row: 2"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-row: 1"></div>
  <div data-gf-id="item-4" data-gf-kind="box"></div>
</div>
