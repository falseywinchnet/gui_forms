<!-- justify-self and align-self override the container per item. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 100px 100px 100px; grid-template-rows: 70px">
  <div data-gf-id="item-0" data-gf-kind="box" style="justify-self: end; align-self: start; width: 30px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="justify-self: center; align-self: center; width: 40px; height: 30px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="justify-self: start; align-self: end; width: 50px; height: 10px"></div>
</div>
