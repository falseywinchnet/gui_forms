<!-- Sparse flow leaves the holes a span leaves. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: repeat(3, 60px); grid-auto-rows: 25px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-column: span 3"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-column: span 2"></div>
  <div data-gf-id="item-4" data-gf-kind="box"></div>
  <div data-gf-id="item-5" data-gf-kind="box"></div>
</div>
