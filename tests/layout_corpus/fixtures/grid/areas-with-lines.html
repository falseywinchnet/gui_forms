<!-- Named areas beside line-placed and auto-placed items. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 80px 80px 80px; grid-template-rows: 30px 30px; grid-template-areas: 'a a .' '. b b'">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-area: b"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-area: a"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-column: 1; grid-row: 2"></div>
</div>
