<!-- A spanning item's content is shared over the auto columns it spans. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: 30px 30px">
  <div data-gf-id="one" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="one-0" data-gf-kind="box" style="width: 50px; height: 20px"></div>
    </div>
  <div data-gf-id="two" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="two-0" data-gf-kind="box" style="width: 30px; height: 20px"></div>
    </div>
  <div data-gf-id="three" data-gf-kind="box"></div>
  <div data-gf-id="span" data-gf-kind="flex-panel"
         style="display: flex; grid-column: 1 / 3">
      <div data-gf-id="span-0" data-gf-kind="box" style="width: 100px; height: 20px"></div>
      <div data-gf-id="span-1" data-gf-kind="box" style="width: 80px; height: 20px"></div>
    </div>
</div>
