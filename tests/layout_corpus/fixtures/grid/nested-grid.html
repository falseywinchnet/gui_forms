<!-- A nested grid in an auto column sizes from its own tracks. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto; align-content: start; column-gap: 10px">
  <div data-gf-id="inner" data-gf-kind="grid-panel"
         style="display: grid; grid-template-columns: 40px 60px; grid-template-rows: 20px 30px; gap: 5px">
      <div data-gf-id="inner-item-0" data-gf-kind="box"></div>
      <div data-gf-id="inner-item-1" data-gf-kind="box"></div>
      <div data-gf-id="inner-item-2" data-gf-kind="box"></div>
      <div data-gf-id="inner-item-3" data-gf-kind="box"></div>
    </div>
  <div data-gf-id="after" data-gf-kind="box" style="height: 30px"></div>
</div>
