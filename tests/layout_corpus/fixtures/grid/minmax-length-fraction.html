<!-- The atlas form minmax(px, fr): a floor under each share. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: minmax(150px, 1fr) minmax(100px, 2fr); grid-template-rows: 30px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
</div>
