<!-- Line numbers place items out of document order. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 70px 70px 70px; grid-template-rows: 30px 30px 30px">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-column: 3; grid-row: 1"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-column: 1; grid-row: 3"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-column: 2 / 4; grid-row: 2"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-column: 1; grid-row: 1 / 3"></div>
</div>
