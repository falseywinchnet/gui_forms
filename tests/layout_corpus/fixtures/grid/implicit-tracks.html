<!-- Items beyond the explicit grid add implicit tracks of the auto sizes. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 60px 60px; grid-template-rows: 30px; grid-auto-columns: 40px; grid-auto-rows: 20px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="grid-column: 4; grid-row: 3"></div>
  <div data-gf-id="item-4" data-gf-kind="box"></div>
</div>
