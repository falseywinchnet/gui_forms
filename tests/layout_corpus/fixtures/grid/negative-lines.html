<!-- Negative lines count from the explicit grid's end. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 60px 60px 60px 60px; grid-template-rows: 30px 30px">
  <div data-gf-id="item-0" data-gf-kind="box" style="grid-column: 1 / -1"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="grid-column: -3 / -1; grid-row: 2"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="grid-column: -5 / -4; grid-row: 2"></div>
</div>
