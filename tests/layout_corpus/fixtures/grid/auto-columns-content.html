<!-- Auto columns size to their content; the fraction takes the rest. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: auto auto 1fr; grid-template-rows: 40px; column-gap: 6px">
  <div data-gf-id="first" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="first-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
      <div data-gf-id="first-1" data-gf-kind="box" style="width: 30px; height: 20px"></div>
    </div>
  <div data-gf-id="second" data-gf-kind="flex-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="second-0" data-gf-kind="box" style="width: 70px; height: 20px"></div>
    </div>
  <div data-gf-id="third" data-gf-kind="box"></div>
</div>
