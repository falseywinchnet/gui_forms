<!-- min-content and max-content columns over wrapping content. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: min-content max-content 1fr; grid-template-rows: 50px">
  <div data-gf-id="narrow" data-gf-kind="flex-layout-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="narrow-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
      <div data-gf-id="narrow-1" data-gf-kind="box" style="width: 60px; height: 20px"></div>
      <div data-gf-id="narrow-2" data-gf-kind="box" style="width: 30px; height: 20px"></div>
    </div>
  <div data-gf-id="wide" data-gf-kind="flex-layout-panel"
         style="display: flex; flex-wrap: wrap">
      <div data-gf-id="wide-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
      <div data-gf-id="wide-1" data-gf-kind="box" style="width: 60px; height: 20px"></div>
      <div data-gf-id="wide-2" data-gf-kind="box" style="width: 30px; height: 20px"></div>
    </div>
  <div data-gf-id="rest" data-gf-kind="box"></div>
</div>
