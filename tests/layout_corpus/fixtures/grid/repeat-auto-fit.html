<!-- auto-fit collapses the empty repetitions, so the items share the width. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); grid-template-rows: 30px; column-gap: 6px">
  <div data-gf-id="item-0" data-gf-kind="box"></div>
  <div data-gf-id="item-1" data-gf-kind="box"></div>
  <div data-gf-id="item-2" data-gf-kind="box"></div>
</div>
