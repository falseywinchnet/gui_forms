<!-- Auto margins centre or push an item in its area. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 150px 150px; grid-template-rows: 80px 80px">
  <div data-gf-id="item-0" data-gf-kind="box" style="margin: auto; width: 40px; height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="margin-left: auto; width: 40px; height: 20px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="margin-top: auto; margin-bottom: auto; width: 40px; height: 20px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="margin: 5px 10px"></div>
</div>
