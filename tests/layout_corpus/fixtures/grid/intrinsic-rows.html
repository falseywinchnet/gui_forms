<!-- minmax(30px, auto) rows grow with their content. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel"
     style="display: grid; grid-template-columns: 100px 100px; grid-auto-rows: minmax(30px, auto); align-content: start">
  <div data-gf-id="item-0" data-gf-kind="box" style="height: 20px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="height: 45px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="height: 10px"></div>
  <div data-gf-id="item-3" data-gf-kind="box"></div>
</div>
