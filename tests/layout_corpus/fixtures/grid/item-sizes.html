<!-- Definite item sizes start-align; minimums and maximums bound the stretch. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 120px 120px 120px; grid-template-rows: 60px 60px">
  <div data-gf-id="item-0" data-gf-kind="box" style="width: 50px; height: 30px"></div>
  <div data-gf-id="item-1" data-gf-kind="box" style="min-width: 130px"></div>
  <div data-gf-id="item-2" data-gf-kind="box" style="max-width: 70px; max-height: 40px"></div>
  <div data-gf-id="item-3" data-gf-kind="box" style="width: 50%"></div>
  <div data-gf-id="item-4" data-gf-kind="box" style="height: 25%"></div>
  <div data-gf-id="item-5" data-gf-kind="box" style="min-height: 80px"></div>
</div>
