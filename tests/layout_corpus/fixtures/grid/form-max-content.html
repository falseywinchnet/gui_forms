<!-- The settings-form shape: max-content captions and minmax(0, 1fr) fields. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 12px; align-content: start">
  <div data-gf-id="caption-0" data-gf-kind="box" style="width: 60px; height: 20px"></div>
  <div data-gf-id="field-0" data-gf-kind="box" style="height: 24px"></div>
  <div data-gf-id="caption-1" data-gf-kind="box" style="width: 90px; height: 20px"></div>
  <div data-gf-id="field-1" data-gf-kind="box" style="height: 24px"></div>
  <div data-gf-id="caption-2" data-gf-kind="box" style="width: 40px; height: 20px"></div>
  <div data-gf-id="field-2" data-gf-kind="box" style="height: 24px"></div>
</div>
