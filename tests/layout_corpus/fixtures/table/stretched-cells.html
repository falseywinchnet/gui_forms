<!-- Items with no size stretch to fill their cells, less margins. -->
<div data-gf-id="root" data-gf-kind="table-layout-panel"
     style="display: grid; grid-template-columns: 120px minmax(0, 1fr); grid-template-rows: 60px minmax(0, 1fr); justify-content: start; align-content: start">
  <div data-gf-id="a" data-gf-kind="box" style="grid-column: 1; grid-row: 1; "></div>
  <div data-gf-id="b" data-gf-kind="box" style="grid-column: 2; grid-row: 1; "></div>
  <div data-gf-id="c" data-gf-kind="box" style="grid-column: 1; grid-row: 2; margin: 5px"></div>
  <div data-gf-id="d" data-gf-kind="box" style="grid-column: 2; grid-row: 2; margin: 2px 10px"></div>
</div>
