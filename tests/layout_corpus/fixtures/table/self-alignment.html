<!-- Per-item alignment inside a cell. -->
<div data-gf-id="root" data-gf-kind="table-layout-panel-compat"
     style="display: grid; grid-template-columns: 150px 150px 150px; grid-template-rows: 90px 90px; justify-content: start; align-content: start">
  <div data-gf-id="start" data-gf-kind="box" style="grid-column: 1; grid-row: 1; width: 50px; height: 20px; justify-self: start; align-self: start"></div>
  <div data-gf-id="center" data-gf-kind="box" style="grid-column: 2; grid-row: 1; width: 50px; height: 20px; justify-self: center; align-self: center"></div>
  <div data-gf-id="end" data-gf-kind="box" style="grid-column: 3; grid-row: 1; width: 50px; height: 20px; justify-self: end; align-self: end"></div>
  <div data-gf-id="mixed" data-gf-kind="box" style="grid-column: 1; grid-row: 2; width: 50px; height: 20px; justify-self: end; align-self: start"></div>
  <div data-gf-id="stretch-x" data-gf-kind="box" style="grid-column: 2; grid-row: 2; height: 20px; justify-self: stretch; align-self: center"></div>
</div>
