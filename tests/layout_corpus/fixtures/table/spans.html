<!-- Column and row spans across gaps. -->
<div data-gf-id="root" data-gf-kind="table-layout-panel"
     style="display: grid; grid-template-columns: 100px 100px 100px; grid-template-rows: 50px 50px 50px; gap: 4px 6px; justify-content: start; align-content: start">
  <div data-gf-id="wide" data-gf-kind="box" style="grid-column: 1 / span 2; grid-row: 1; height: 30px"></div>
  <div data-gf-id="tall" data-gf-kind="box" style="grid-column: 3; grid-row: 1 / span 3; width: 40px"></div>
  <div data-gf-id="block" data-gf-kind="box" style="grid-column: 1 / span 2; grid-row: 2 / span 2"></div>
</div>
