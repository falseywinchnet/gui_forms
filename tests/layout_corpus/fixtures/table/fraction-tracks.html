<!-- Shares of the whole client area (TableLayoutPanel percent tracks). -->
<div data-gf-id="root" data-gf-kind="table-layout-panel"
     style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); justify-items: start; align-items: start; justify-content: start; align-content: start">
  <div data-gf-id="a" data-gf-kind="box" style="grid-column: 1; grid-row: 1; width: 30px; height: 30px"></div>
  <div data-gf-id="b" data-gf-kind="box" style="grid-column: 2; grid-row: 1; width: 30px; height: 30px"></div>
  <div data-gf-id="c" data-gf-kind="box" style="grid-column: 3; grid-row: 2; width: 30px; height: 30px"></div>
</div>
