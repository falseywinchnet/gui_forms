<!-- A form: headings, inline fields, a centred button row. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 8px">
  <div data-gf-id="head" data-gf-kind="block-panel" style="margin-bottom: 12px">
    <div data-gf-id="head-0" data-gf-kind="box" style="height: 24px; margin-bottom: 6px"></div>
    <div data-gf-id="head-1" data-gf-kind="box" style="height: 14px"></div>
  </div>
  <div data-gf-id="row" data-gf-kind="block-panel" style="font-size: 0; margin-bottom: 8px">
    <div data-gf-id="row-0" data-gf-kind="box" style="display: inline-block; width: 90px; height: 22px; vertical-align: middle"></div>
    <div data-gf-id="row-1" data-gf-kind="box" style="display: inline-block; width: 180px; height: 26px; margin-left: 8px; vertical-align: middle"></div>
  </div>
  <div data-gf-id="row2" data-gf-kind="block-panel" style="font-size: 0; margin-bottom: 8px">
    <div data-gf-id="row2-0" data-gf-kind="box" style="display: inline-block; width: 90px; height: 22px; vertical-align: middle"></div>
    <div data-gf-id="row2-1" data-gf-kind="box" style="display: inline-block; width: 180px; height: 26px; margin-left: 8px; vertical-align: middle"></div>
  </div>
  <div data-gf-id="buttons" data-gf-kind="block-panel" style="font-size: 0; text-align: center; margin-top: 16px">
    <div data-gf-id="ok" data-gf-kind="box" style="display: inline-block; width: 80px; height: 26px"></div>
    <div data-gf-id="cancel" data-gf-kind="box" style="display: inline-block; width: 80px; height: 26px; margin-left: 8px"></div>
  </div>
</div>
