<!-- Block flow panels as grid items: margins stay inside each item. -->
<div data-gf-id="root" data-gf-kind="grid-panel" style="display: grid; grid-template-columns: 1fr 1fr; align-items: start; padding: 8px">
  <div data-gf-id="g0" data-gf-kind="block-panel">
    <div data-gf-id="g0-0" data-gf-kind="box" style="height: 20px; margin-top: 10px"></div>
    <div data-gf-id="g0-1" data-gf-kind="box" style="height: 10px; margin-top: 5px"></div>
  </div>
  <div data-gf-id="g1" data-gf-kind="block-panel" style="padding: 4px">
    <div data-gf-id="g1-0" data-gf-kind="box" style="height: 15px; margin-bottom: 12px"></div>
  </div>
</div>
