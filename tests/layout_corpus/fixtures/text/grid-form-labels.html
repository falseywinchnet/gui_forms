<!-- A form: max-content labels and a flexible value column. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: max-content 1fr; align-content: start; gap: 6px 10px; padding: 8px">
  <div data-gf-id="l-0" data-gf-kind="text-block" data-gf-text="Name:"></div>
  <div data-gf-id="v-0" data-gf-kind="box" style="height: 22px"></div>
  <div data-gf-id="l-1" data-gf-kind="text-block" data-gf-text="Destination folder:"></div>
  <div data-gf-id="v-1" data-gf-kind="box" style="height: 22px"></div>
  <div data-gf-id="l-2" data-gf-kind="text-block" data-gf-text="Notes:"></div>
  <div data-gf-id="v-2" data-gf-kind="text-block"
       data-gf-text="Copied files keep their dates; moved files keep their permissions as well."></div>
</div>
