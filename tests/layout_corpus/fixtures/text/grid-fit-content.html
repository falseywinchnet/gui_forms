<!-- fit-content() tracks clamp their text's maximum content size. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: fit-content(120px) fit-content(40px) 1fr; align-content: start">
  <div data-gf-id="clamped" data-gf-kind="text-block" data-gf-text="Longer than one hundred and twenty pixels"></div>
  <div data-gf-id="word" data-gf-kind="text-block" data-gf-text="Overwide"></div>
  <div data-gf-id="rest" data-gf-kind="text-block" data-gf-text="Rest"></div>
</div>
