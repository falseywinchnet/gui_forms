<!-- Text items that grow from a zero basis and from their content. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; align-items: flex-start; column-gap: 4px; padding: 4px">
  <div data-gf-id="zero" data-gf-kind="text-block" style="flex: 1 1 0px" data-gf-text="Grows from nothing"></div>
  <div data-gf-id="content" data-gf-kind="text-block" style="flex: 1 1 auto" data-gf-text="Grows from its content"></div>
  <div data-gf-id="fixed" data-gf-kind="text-block" style="flex: none" data-gf-text="Fixed"></div>
</div>
