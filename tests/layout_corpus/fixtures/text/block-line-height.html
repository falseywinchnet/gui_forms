<!-- Unitless line heights: the leading goes half above and half below. -->
<div data-gf-id="root" data-gf-kind="block-panel">
  <div data-gf-id="normal" data-gf-kind="text-block" style="width: 140px"
       data-gf-text="The normal line height of the face"></div>
  <div data-gf-id="loose" data-gf-kind="text-block" style="width: 140px; line-height: 1.6"
       data-gf-text="One and six tenths of the font size"></div>
  <div data-gf-id="tight" data-gf-kind="text-block" style="width: 140px; line-height: 1"
       data-gf-text="As tall as the font size and no more"></div>
  <div data-gf-id="inherited" data-gf-kind="block-panel" style="line-height: 2">
    <div data-gf-id="double" data-gf-kind="text-block" style="font-size: 0.9rem"
         data-gf-text="Twice the font size, from the panel"></div>
  </div>
</div>
