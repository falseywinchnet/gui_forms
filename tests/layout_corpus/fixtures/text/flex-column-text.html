<!-- A column of text items: their heights follow the width they wrap at. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-direction: column; align-items: flex-start; row-gap: 4px">
  <div data-gf-id="stretched" data-gf-kind="text-block" style="align-self: stretch"
       data-gf-text="This item stretches across the column and wraps where the viewport ends, at any width."></div>
  <div data-gf-id="narrow" data-gf-kind="text-block" style="width: 120px"
       data-gf-text="This one is narrow, so it wraps onto several lines."></div>
  <div data-gf-id="fitted" data-gf-kind="text-block" data-gf-text="Fits its content"></div>
</div>
