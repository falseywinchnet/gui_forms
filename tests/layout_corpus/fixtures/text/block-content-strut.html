<!-- Inline boxes on lines whose strut is the panel's font: Carlito at
     the template's 13 px, line-height: normal. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 4px">
  <div data-gf-id="caption" data-gf-kind="text-block" data-gf-text="Lines with the body font's strut"></div>
  <div data-gf-id="line" data-gf-kind="block-panel"><div data-gf-id="small" data-gf-kind="box" style="display: inline-block; width: 40px; height: 6px"></div><div data-gf-id="tall" data-gf-kind="box" style="display: inline-block; width: 40px; height: 24px"></div><div data-gf-id="middle" data-gf-kind="box" style="display: inline-block; width: 40px; height: 6px; vertical-align: middle"></div></div>
  <div data-gf-id="empty-line" data-gf-kind="block-panel"><div data-gf-id="flat" data-gf-kind="box" style="display: inline-block; width: 60px; height: 0px"></div></div>
</div>
