<!-- auto rows sized by the tallest wrapped text in each. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 100px 100px; align-content: start; justify-content: start; gap: 2px">
  <div data-gf-id="a" data-gf-kind="text-block" data-gf-text="Short"></div>
  <div data-gf-id="b" data-gf-kind="text-block" data-gf-text="Long enough to need three lines here"></div>
  <div data-gf-id="c" data-gf-kind="text-block" data-gf-text="Two lines of it"></div>
  <div data-gf-id="d" data-gf-kind="text-block" data-gf-text="One"></div>
</div>
