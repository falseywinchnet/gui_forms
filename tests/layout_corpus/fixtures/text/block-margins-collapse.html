<!-- Text blocks' margins collapse with each other and through an empty
     one, and the first one's with its parent's. The root's padding keeps
     them inside it, as a window's root holds its content. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 4px">
  <div data-gf-id="section" data-gf-kind="block-panel" style="margin-top: 10px">
    <div data-gf-id="heading" data-gf-kind="text-block" style="margin: 14px 0 8px 0; font-size: 1.3rem; font-weight: bold"
         data-gf-text="Section heading"></div>
    <div data-gf-id="through" data-gf-kind="text-block" style="margin: 12px 0" data-gf-text=""></div>
    <div data-gf-id="body" data-gf-kind="text-block" style="margin-top: 5px"
         data-gf-text="Body text after a heading whose bottom margin collapses through an empty block."></div>
  </div>
</div>
