<!-- Baseline alignment with padding above the text, and a two-line item,
     which aligns by its first line. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; align-items: baseline; column-gap: 6px">
  <div data-gf-id="padded" data-gf-kind="text-block" style="padding: 9px 4px 2px 4px" data-gf-text="Padded"></div>
  <div data-gf-id="two-lines" data-gf-kind="text-block" style="width: 70px" data-gf-text="Wraps onto a second line"></div>
  <div data-gf-id="plain" data-gf-kind="text-block" data-gf-text="Plain"></div>
  <div data-gf-id="self" data-gf-kind="text-block" style="align-self: flex-start" data-gf-text="Start"></div>
</div>
