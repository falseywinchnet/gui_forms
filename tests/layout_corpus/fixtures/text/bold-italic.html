<!-- Bold and italic faces measure differently from the regular one. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; align-items: baseline; column-gap: 6px">
  <div data-gf-id="regular" data-gf-kind="text-block" data-gf-text="Regular weight"></div>
  <div data-gf-id="bold" data-gf-kind="text-block" style="font-weight: bold" data-gf-text="Bold weight"></div>
  <div data-gf-id="italic" data-gf-kind="text-block" style="font-style: italic" data-gf-text="Italic style"></div>
  <div data-gf-id="large-bold" data-gf-kind="text-block" style="font-weight: 700; font-size: 1.2rem"
       data-gf-text="Larger and bold"></div>
</div>
