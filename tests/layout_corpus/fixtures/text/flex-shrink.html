<!-- Long text items shrinking into a narrow row and wrapping to fit. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; align-items: flex-start">
  <div data-gf-id="row" data-gf-kind="flex-panel"
       style="display: flex; width: 300px; align-items: flex-start; column-gap: 6px">
    <div data-gf-id="first" data-gf-kind="text-block"
         data-gf-text="The first item has the longer text of the two, so it shrinks further"></div>
    <div data-gf-id="second" data-gf-kind="text-block" style="flex-shrink: 3"
         data-gf-text="The second shrinks three times as fast"></div>
  </div>
</div>
