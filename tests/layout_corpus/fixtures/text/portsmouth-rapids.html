<!-- The control face, Portsmouth Rapids, in a row and wrapped. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; align-items: baseline; gap: 4px 8px; font-family: 'Portsmouth Rapids'">
  <div data-gf-id="ok" data-gf-kind="text-block" data-gf-text="OK"></div>
  <div data-gf-id="cancel" data-gf-kind="text-block" data-gf-text="Cancel"></div>
  <div data-gf-id="bold" data-gf-kind="text-block" style="font-weight: bold" data-gf-text="Apply"></div>
  <div data-gf-id="wrapped" data-gf-kind="text-block" style="width: 110px"
       data-gf-text="Control text in the control face, wrapped"></div>
  <div data-gf-id="carlito" data-gf-kind="text-block" style="font-family: Carlito" data-gf-text="Body face"></div>
</div>
