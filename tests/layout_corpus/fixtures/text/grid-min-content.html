<!-- min-content, max-content and auto columns sized by their text. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: min-content max-content auto; align-content: start; column-gap: 6px">
  <div data-gf-id="minimum" data-gf-kind="text-block" data-gf-text="The narrowest column it can be"></div>
  <div data-gf-id="maximum" data-gf-kind="text-block" data-gf-text="One line at its full width"></div>
  <div data-gf-id="rest" data-gf-kind="text-block" data-gf-text="The rest of the row, wrapping where the viewport ends."></div>
</div>
