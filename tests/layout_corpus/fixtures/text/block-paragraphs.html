<!-- Text blocks stacked in a block panel: wrapping at the panel's width and
     margins collapsing between them. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 8px">
  <div data-gf-id="first" data-gf-kind="text-block" style="margin-bottom: 10px"
       data-gf-text="Settings are saved when the dialog closes, and applied to every open window at once."></div>
  <div data-gf-id="second" data-gf-kind="text-block" style="margin-top: 6px; width: 180px"
       data-gf-text="A narrower paragraph wraps sooner, so it takes more lines than the first one does."></div>
  <div data-gf-id="third" data-gf-kind="text-block" data-gf-text="One line."></div>
</div>
