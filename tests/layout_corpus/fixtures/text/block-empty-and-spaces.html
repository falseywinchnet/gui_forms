<!-- An empty text block and one of white space have no line box; runs of
     spaces collapse to one, and leading and trailing ones go. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 4px">
  <div data-gf-id="empty" data-gf-kind="text-block" data-gf-text=""></div>
  <div data-gf-id="spaces" data-gf-kind="text-block" data-gf-text="    "></div>
  <div data-gf-id="padded-empty" data-gf-kind="text-block" style="padding: 3px" data-gf-text=""></div>
  <div data-gf-id="collapsed" data-gf-kind="text-block" style="width: 90px"
       data-gf-text="   Runs    of   spaces   collapse   "></div>
  <div data-gf-id="after" data-gf-kind="text-block" data-gf-text="After"></div>
</div>
