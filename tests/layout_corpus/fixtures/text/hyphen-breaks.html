<!-- Lines break after a hyphen and at spaces, but not inside a word.
     Between a hyphen and a digit UAX #14 (LB25) forbids a break, which the
     text engine keeps; Chromium breaks there, so the last block, laid out
     after the others so that none of them moves, is a recorded difference. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 4px">
  <div data-gf-id="hyphens" data-gf-kind="text-block" style="width: 70px"
       data-gf-text="A well-known, long-standing re-entry rule"></div>
  <div data-gf-id="slashes" data-gf-kind="text-block" style="width: 120px"
       data-gf-text="Input/output and read/write"></div>
  <div data-gf-id="numbers" data-gf-kind="text-block" style="width: 60px"
       data-gf-expected-difference="UAX #14 LB25 keeps a hyphen with the digit after it (10-20 stays whole); Chromium 155 breaks after the hyphen"
       data-gf-text="Pages 10-20 and 30-45 (twice)"></div>
</div>
