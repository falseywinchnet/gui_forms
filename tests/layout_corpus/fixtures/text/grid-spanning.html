<!-- A text item spanning two auto columns grows them both. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: auto auto 1fr; align-content: start; column-gap: 4px">
  <div data-gf-id="a" data-gf-kind="text-block" data-gf-text="A"></div>
  <div data-gf-id="b" data-gf-kind="text-block" data-gf-text="B"></div>
  <div data-gf-id="c" data-gf-kind="text-block" data-gf-text="C"></div>
  <div data-gf-id="span" data-gf-kind="text-block" style="grid-column: 1 / span 2"
       data-gf-text="Spanning the first two"></div>
</div>
