<!-- A card of wrapped text: a heading, a paragraph and a footnote. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 10px">
  <div data-gf-id="card" data-gf-kind="block-panel" style="width: 260px; padding: 12px">
    <div data-gf-id="title" data-gf-kind="text-block" style="font-size: 1.25rem; font-weight: bold; margin-bottom: 6px"
         data-gf-text="Storage almost full"></div>
    <div data-gf-id="text" data-gf-kind="text-block"
         data-gf-text="Free some space by emptying the recycle bin or moving large files to another drive."></div>
    <div data-gf-id="footnote" data-gf-kind="text-block" style="font-size: 0.85rem; margin-top: 8px; line-height: 1.3"
         data-gf-text="Checked every hour while the computer is on."></div>
  </div>
</div>
