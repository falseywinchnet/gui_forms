<!-- align-items: baseline across text of three sizes and a box, whose
     baseline is its bottom edge. -->
<div data-gf-id="root" data-gf-kind="flex-panel"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; align-items: baseline; column-gap: 8px">
  <div data-gf-id="small" data-gf-kind="text-block" style="font-size: 0.85rem" data-gf-text="Rate"></div>
  <div data-gf-id="large" data-gf-kind="text-block" style="font-size: 1.5rem" data-gf-text="42 MB/s"></div>
  <div data-gf-id="normal" data-gf-kind="text-block" style="padding-top: 5px" data-gf-text="sustained"></div>
  <div data-gf-id="box" data-gf-kind="box" style="width: 20px; height: 12px"></div>
</div>
