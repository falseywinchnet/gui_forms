<!-- align-items: baseline in a grid row across text sizes. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: auto auto auto; align-content: start; justify-content: start; align-items: baseline; column-gap: 8px">
  <div data-gf-id="label" data-gf-kind="text-block" data-gf-text="Size"></div>
  <div data-gf-id="value" data-gf-kind="text-block" style="font-size: 1.6rem" data-gf-text="1.4 GB"></div>
  <div data-gf-id="note" data-gf-kind="text-block" style="font-size: 0.8rem; padding-top: 3px" data-gf-text="on disk"></div>
</div>
