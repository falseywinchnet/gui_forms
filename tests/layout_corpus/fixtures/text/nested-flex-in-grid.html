<!-- Two grid columns, each a column of wrapped text items. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 1fr 1fr; align-content: start; column-gap: 10px">
  <div data-gf-id="left" data-gf-kind="flex-panel" style="display: flex; flex-direction: column; row-gap: 4px">
    <div data-gf-id="l-0" data-gf-kind="text-block" data-gf-text="The left column holds a longer paragraph of text."></div>
    <div data-gf-id="l-1" data-gf-kind="text-block" data-gf-text="And a second one."></div>
  </div>
  <div data-gf-id="right" data-gf-kind="flex-panel" style="display: flex; flex-direction: column; row-gap: 4px">
    <div data-gf-id="r-0" data-gf-kind="text-block" style="text-align: end" data-gf-text="Right, at the end"></div>
    <div data-gf-id="r-1" data-gf-kind="text-block" data-gf-text="Wrapping in the right column as well, when narrow."></div>
  </div>
</div>
