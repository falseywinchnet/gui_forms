<!-- The atlas's form row: a text block, a field-sized box and a
     button-sized box in a flex row, inside a grid cell. -->
<div data-gf-id="root" data-gf-kind="grid-panel"
     style="display: grid; grid-template-columns: 1fr 120px; align-content: start; gap: 8px; padding: 8px">
  <div data-gf-id="row" data-gf-kind="flex-panel" style="display: flex; align-items: center; column-gap: 6px">
    <div data-gf-id="label" data-gf-kind="text-block" style="flex: none" data-gf-text="Search for:"></div>
    <div data-gf-id="field" data-gf-kind="box" style="flex: 1 1 auto; height: 24px; min-width: 40px"></div>
    <div data-gf-id="button" data-gf-kind="box" style="flex: none; width: 72px; height: 26px"></div>
  </div>
  <div data-gf-id="side" data-gf-kind="text-block" data-gf-text="Matches are listed below as they are found."></div>
</div>
