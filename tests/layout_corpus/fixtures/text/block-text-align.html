<!-- text-align on text blocks: start, end, centre, left and right, set on
     the block and inherited from the panel. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 6px">
  <div data-gf-id="start" data-gf-kind="text-block" data-gf-text="Start of the line"></div>
  <div data-gf-id="end" data-gf-kind="text-block" style="text-align: end" data-gf-text="End of the line"></div>
  <div data-gf-id="center" data-gf-kind="text-block" style="text-align: center"
       data-gf-text="Centred, and wrapping onto a second line in the narrower viewports"></div>
  <div data-gf-id="inherited" data-gf-kind="block-panel" style="text-align: right">
    <div data-gf-id="right" data-gf-kind="text-block" data-gf-text="Right, from the panel"></div>
    <div data-gf-id="left" data-gf-kind="text-block" style="text-align: left" data-gf-text="Left, its own"></div>
  </div>
</div>
