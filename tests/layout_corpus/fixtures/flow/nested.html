<!-- A column flow inside a row flow, with fixed outer sizes. -->
<div data-gf-id="root" data-gf-kind="flow-layout-panel-compat"
     style="display: flex; flex-wrap: wrap; align-content: flex-start; flex-direction: row; align-items: flex-start; padding: 8px; gap: 8px">
  <div data-gf-id="column" data-gf-kind="flow-layout-panel-compat" style="flex: none; width: 160px; height: 200px; display: flex; flex-direction: column; flex-wrap: nowrap; align-items: flex-start; align-content: flex-start; padding: 4px; gap: 4px">
    <div data-gf-id="column-a" data-gf-kind="box" style="flex: none; width: 140px; height: 30px"></div>
    <div data-gf-id="column-b" data-gf-kind="box" style="flex: none; width: 100px; height: 50px"></div>
  </div>
  <div data-gf-id="beside" data-gf-kind="box" style="flex: none; width: 200px; height: 120px"></div>
  <div data-gf-id="after" data-gf-kind="box" style="flex: none; width: 260px; height: 40px"></div>
</div>
