<!-- Free space shared by grow factors 1 and 2 on one line. -->
<div data-gf-id="root" data-gf-kind="flow-layout-panel-compat"
     style="display: flex; flex-wrap: nowrap; flex-direction: row; align-items: flex-start; padding: 4px; gap: 8px">
  <div data-gf-id="fixed" data-gf-kind="box" style="flex: none; width: 100px; height: 30px"></div>
  <div data-gf-id="grow-1" data-gf-kind="box" style="flex: 1 0 auto; width: 40px; height: 30px"></div>
  <div data-gf-id="grow-2" data-gf-kind="box" style="flex: 2 0 auto; width: 40px; height: 30px"></div>
</div>
