<!-- Absolute items take no grid cell; auto placement skips them. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel" style="display: grid; grid-template-columns: 100px 100px; grid-template-rows: 40px 40px; gap: 10px; padding: 12px">
  <div data-gf-id="a" data-gf-kind="box"></div>
  <div data-gf-id="pinned" data-gf-kind="box" style="position: absolute; top: 0; right: 0; width: 30px; height: 30px"></div>
  <div data-gf-id="b" data-gf-kind="box"></div>
  <div data-gf-id="c" data-gf-kind="box"></div>
  <div data-gf-id="band" data-gf-kind="box" style="position: absolute; left: 0; right: 0; bottom: 0; height: 15px"></div>
</div>
