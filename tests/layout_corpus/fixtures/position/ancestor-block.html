<!-- A grandchild's containing block is its positioned grandparent. -->
<div data-gf-id="root" data-gf-kind="block-flow-panel" style="padding: 8px">
  <div data-gf-id="a" data-gf-kind="box" style="height: 20px"></div>
  <div data-gf-id="ancestor" data-gf-kind="flex-layout-panel" style="display: flex; position: relative; height: 200px; padding: 10px">
    <div data-gf-id="middle" data-gf-kind="grid-layout-panel" style="display: grid; width: 100px; height: 100px; grid-template-columns: 1fr">
      <div data-gf-id="middle-0" data-gf-kind="box" style="height: 20px"></div>
      <div data-gf-id="pinned" data-gf-kind="box" style="position: absolute; left: 0; bottom: 0; width: 30px; height: 10px"></div>
      <div data-gf-id="corner" data-gf-kind="box" style="position: absolute; right: 5px; top: 5px; width: 12px; height: 12px"></div>
    </div>
  </div>
</div>
