<!-- min and max sizes bound a stretched absolute item. -->
<div data-gf-id="root" data-gf-kind="flex-layout-panel" style="display: flex; padding: 4px">
  <div data-gf-id="max" data-gf-kind="box" style="position: absolute; top: 0; left: 0; right: 0; height: 20px; max-width: 150px"></div>
  <div data-gf-id="min" data-gf-kind="box" style="position: absolute; top: 30px; left: 0; width: 10px; height: 20px; min-width: 70px"></div>
  <div data-gf-id="both" data-gf-kind="box" style="position: absolute; top: 60px; bottom: 0; left: 200px; width: 30px; max-height: 100px; min-height: 40px"></div>
</div>
