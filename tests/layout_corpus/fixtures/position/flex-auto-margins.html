<div data-gf-id="root" data-gf-kind="flex-layout-panel" style="display: flex">
  <div data-gf-id="centred" data-gf-kind="box" style="position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 120px; height: 60px; margin: auto"></div>
  <div data-gf-id="right" data-gf-kind="box" style="position: absolute; top: 10px; left: 0; right: 0; width: 80px; height: 20px; margin-left: auto"></div>
  <div data-gf-id="over" data-gf-kind="box" style="position: absolute; top: 100px; left: 30px; right: 40px; width: 90px; height: 20px"></div>
</div>
