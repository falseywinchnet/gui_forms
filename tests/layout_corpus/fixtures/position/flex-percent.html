<!-- Percentage insets and sizes are of the padding box. -->
<div data-gf-id="root" data-gf-kind="flex-panel" style="display: flex; padding: 20px">
  <div data-gf-id="a" data-gf-kind="box" style="width: 30px; height: 30px"></div>
  <div data-gf-id="p" data-gf-kind="box" style="position: absolute; top: 10%; left: 25%; width: 50%; height: 20%"></div>
  <div data-gf-id="q" data-gf-kind="box" style="position: absolute; bottom: 5%; right: 10%; width: 100px; height: calc(10% + 6px)"></div>
  <div data-gf-id="r" data-gf-kind="box" style="position: absolute; top: calc(50% - 10px); left: 0; right: 50%; height: 20px"></div>
</div>
