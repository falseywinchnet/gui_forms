<!-- A relative container in a grid is its absolute items' block; a static one passes it up. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel" style="display: grid; grid-template-columns: 150px 150px; grid-template-rows: 120px; gap: 20px; padding: 10px">
  <div data-gf-id="positioned" data-gf-kind="block-flow-panel" style="position: relative; padding: 5px">
    <div data-gf-id="positioned-0" data-gf-kind="box" style="height: 20px"></div>
    <div data-gf-id="p-pin" data-gf-kind="box" style="position: absolute; bottom: 4px; right: 4px; width: 20px; height: 20px"></div>
  </div>
  <div data-gf-id="plain" data-gf-kind="block-flow-panel" style="padding: 5px">
    <div data-gf-id="plain-0" data-gf-kind="box" style="height: 20px"></div>
    <div data-gf-id="q-pin" data-gf-kind="box" style="position: absolute; bottom: 4px; right: 4px; width: 20px; height: 20px"></div>
  </div>
</div>
