  <div data-gf-id="b" data-gf-kind="box" style="position: relative; left: 15px; top: 5px; width: 50px; height: 30px"></div>
  <div data-gf-id="c" data-gf-kind="box" style="width: 50px; height: 30px"></div>
  <div data-gf-id="d" data-gf-kind="box" style="position: relative; right: 10px; bottom: 8px; width: 50px; height: 30px"></div>
  <div data-gf-id="e" data-gf-kind="box" style="position: relative; left: 10%; top: 10%; width: 50px; height: 30px"></div>
  <div data-gf-id="f" data-gf-kind="box" style="position: relative; left: 5px; right: 50px; top: 4px; bottom: 50px; width: 50px; height: 30px"></div>
</div>
