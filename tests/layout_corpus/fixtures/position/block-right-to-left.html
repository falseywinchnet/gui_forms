<!-- Right to left: an over-constrained item keeps its right inset; right wins a relative offset. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 8px">
  <div data-gf-id="frame" data-gf-kind="block-panel" style="position: relative; direction: rtl; height: 160px; padding: 8px">
    <div data-gf-id="a" data-gf-kind="box" style="height: 20px"></div>
    <div data-gf-id="over" data-gf-kind="box" style="position: absolute; top: 30px; left: 10px; right: 20px; width: 50px; height: 20px"></div>
    <div data-gf-id="b" data-gf-kind="box" style="position: relative; left: 10px; right: 30px; height: 20px; width: 100px"></div>
    <div data-gf-id="fit" data-gf-kind="box" style="position: absolute; top: 80px; left: 0; right: 0; width: 60px; height: 10px; margin-left: auto; margin-right: auto"></div>
  </div>
</div>
