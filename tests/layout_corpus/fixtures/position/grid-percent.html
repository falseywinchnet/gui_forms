<!-- Percentages of a grid container's padding box. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel" style="display: grid; grid-template-columns: 1fr 2fr; padding: 10px 20px">
  <div data-gf-id="a" data-gf-kind="box" style="height: 30px"></div>
  <div data-gf-id="b" data-gf-kind="box" style="height: 30px"></div>
  <div data-gf-id="p" data-gf-kind="box" style="position: absolute; top: 25%; bottom: 25%; left: 10%; right: 60%"></div>
  <div data-gf-id="q" data-gf-kind="box" style="position: absolute; top: 5px; left: 50%; width: 25%; height: 10%"></div>
</div>
