<!-- A relative ancestor's own offset moves its absolute descendants. -->
<div data-gf-id="root" data-gf-kind="block-flow-panel" style="padding: 8px">
  <div data-gf-id="ancestor" data-gf-kind="flex-layout-panel" style="display: flex; position: relative; top: 15px; left: 25px; height: 150px; width: 300px">
    <div data-gf-id="middle" data-gf-kind="block-flow-panel" style="width: 120px; padding: 6px">
      <div data-gf-id="middle-0" data-gf-kind="box" style="height: 20px"></div>
      <div data-gf-id="pinned" data-gf-kind="box" style="position: absolute; right: 10px; bottom: 10px; width: 20px; height: 20px"></div>
    </div>
  </div>
</div>
