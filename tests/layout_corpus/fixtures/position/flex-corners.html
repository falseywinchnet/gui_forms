  <div data-gf-id="a" data-gf-kind="box" style="width: 50px; height: 30px"></div>
  <div data-gf-id="tl" data-gf-kind="box" style="position: absolute; top: 0; left: 0; width: 20px; height: 20px"></div>
  <div data-gf-id="b" data-gf-kind="box" style="width: 60px; height: 40px"></div>
  <div data-gf-id="tr" data-gf-kind="box" style="position: absolute; top: 4px; right: 4px; width: 20px; height: 24px"></div>
  <div data-gf-id="bl" data-gf-kind="box" style="position: absolute; bottom: 0; left: 12px; width: 30px; height: 10px"></div>

</div>
