<!-- A form pattern: a badge pinned to a field and a footer pinned to the panel. -->
<div data-gf-id="root" data-gf-kind="block-flow-panel" style="padding: 12px">
  <div data-gf-id="title" data-gf-kind="box" style="height: 24px; margin-bottom: 10px"></div>
  <div data-gf-id="field" data-gf-kind="flex-layout-panel" style="display: flex; position: relative; height: 26px; margin-bottom: 8px; gap: 8px">
    <div data-gf-id="label" data-gf-kind="box" style="width: 90px"></div>
    <div data-gf-id="input" data-gf-kind="box" style="flex-grow: 1"></div>
    <div data-gf-id="badge" data-gf-kind="box" style="position: absolute; top: -6px; right: -6px; width: 14px; height: 14px"></div>
  </div>
  <div data-gf-id="field2" data-gf-kind="flex-layout-panel" style="display: flex; position: relative; height: 26px; gap: 8px">
    <div data-gf-id="label2" data-gf-kind="box" style="width: 90px"></div>
    <div data-gf-id="input2" data-gf-kind="box" style="flex-grow: 1"></div>
  </div>
  <div data-gf-id="footer" data-gf-kind="flex-layout-panel" style="display: flex; position: absolute; left: 12px; right: 12px; bottom: 12px; height: 30px; justify-content: flex-end; gap: 8px">
    <div data-gf-id="ok" data-gf-kind="box" style="width: 80px"></div>
    <div data-gf-id="cancel" data-gf-kind="box" style="width: 80px"></div>
  </div>
</div>
