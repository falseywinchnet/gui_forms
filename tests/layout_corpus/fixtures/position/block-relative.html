<!-- Relative blocks and inline items shift without moving their neighbours. -->
<div data-gf-id="root" data-gf-kind="block-flow-panel" style="padding: 8px">
  <div data-gf-id="a" data-gf-kind="box" style="height: 20px"></div>
  <div data-gf-id="b" data-gf-kind="box" style="position: relative; top: 6px; left: 12px; height: 20px"></div>
  <div data-gf-id="c" data-gf-kind="box" style="height: 20px"></div>
  <div data-gf-id="line" data-gf-kind="block-flow-panel" style="font-size: 0">
    <div data-gf-id="i0" data-gf-kind="box" style="display: inline-block; width: 40px; height: 20px"></div>
    <div data-gf-id="i1" data-gf-kind="box" style="display: inline-block; position: relative; top: -4px; left: 6px; width: 40px; height: 20px"></div>
    <div data-gf-id="i2" data-gf-kind="box" style="display: inline-block; width: 40px; height: 20px"></div>
  </div>
</div>
