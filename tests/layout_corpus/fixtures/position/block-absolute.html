  <div data-gf-id="b" data-gf-kind="box" style="height: 20px; margin-top: 20px"></div>
  <div data-gf-id="bottom" data-gf-kind="box" style="position: absolute; left: 8px; right: 8px; bottom: 8px; height: 12px"></div>
  <div data-gf-id="c" data-gf-kind="box" style="height: 20px"></div>
