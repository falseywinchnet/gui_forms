<!-- Relative grid items shift within their cells' coordinates. -->
<div data-gf-id="root" data-gf-kind="grid-layout-panel" style="display: grid; grid-template-columns: repeat(3, 80px); grid-auto-rows: 50px; padding: 6px">
  <div data-gf-id="a" data-gf-kind="box" style="position: relative; top: 10px; left: 10px"></div>
  <div data-gf-id="b" data-gf-kind="box"></div>
  <div data-gf-id="c" data-gf-kind="box" style="position: relative; bottom: 5px; right: 20px; width: 40px; height: 20px"></div>
  <div data-gf-id="d" data-gf-kind="box" style="position: relative; left: 12px; top: -6px"></div>
</div>
