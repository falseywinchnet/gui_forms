<!-- An absolute block flow panel takes its content's height and shrinks to fit. -->
<div data-gf-id="root" data-gf-kind="block-panel" style="padding: 8px">
  <div data-gf-id="a" data-gf-kind="box" style="height: 20px"></div>
  <div data-gf-id="panel" data-gf-kind="block-panel" style="position: absolute; top: 30px; left: 20px; padding: 4px">
    <div data-gf-id="panel-0" data-gf-kind="box" style="height: 15px; width: 70px"></div>
    <div data-gf-id="panel-1" data-gf-kind="box" style="height: 25px; width: 40px; margin-top: 5px"></div>
  </div>
  <div data-gf-id="line" data-gf-kind="block-panel" style="position: absolute; font-size: 0; top: 120px; right: 10px">
    <div data-gf-id="line-0" data-gf-kind="box" style="display: inline-block; width: 30px; height: 10px"></div>
    <div data-gf-id="line-1" data-gf-kind="box" style="display: inline-block; width: 45px; height: 14px"></div>
  </div>
</div>
