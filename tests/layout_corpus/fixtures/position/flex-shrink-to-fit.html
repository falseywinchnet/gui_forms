<!-- An absolute flex container with one horizontal inset shrinks to fit its items. -->
<div data-gf-id="root" data-gf-kind="flex-panel" style="display: flex; padding: 8px">
  <div data-gf-id="fit" data-gf-kind="flex-panel" style="display: flex; position: absolute; top: 10px; left: 10px; gap: 4px">
    <div data-gf-id="fit-0" data-gf-kind="box" style="width: 40px; height: 20px"></div>
    <div data-gf-id="fit-1" data-gf-kind="box" style="width: 60px; height: 30px"></div>
  </div>
  <div data-gf-id="end" data-gf-kind="flex-panel" style="display: flex; position: absolute; top: 60px; right: 10px">
    <div data-gf-id="end-0" data-gf-kind="box" style="width: 25px; height: 10px"></div>
    <div data-gf-id="end-1" data-gf-kind="box" style="width: 35px; height: 15px"></div>
  </div>
  <div data-gf-id="tall" data-gf-kind="flex-panel" style="display: flex; position: absolute; top: 120px; left: 0; flex-direction: column">
    <div data-gf-id="tall-0" data-gf-kind="box" style="width: 50px; height: 10px"></div>
    <div data-gf-id="tall-1" data-gf-kind="box" style="width: 70px; height: 12px"></div>
  </div>
</div>
