name: Owned inflate sustained fuzz campaign
on:
  push:
    branches: [codex/png-owned-codec]
    paths: [planning/stages/Z-zlib/INFLATE_CAMPAIGN.json]
  workflow_dispatch:
permissions:
  contents: read
# Deliberately no branch cancellation: unrelated PNG pushes must not erase
# long-running evidence. A changed campaign plan explicitly starts a new run.
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Test the supervisor and verify the source lock
        run: python3 -B -m unittest discover -s tools -p test_inflate_campaign.py
      - name: Expand the locked campaign
        id: plan
        run: |
          python3 -B - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          from run_inflate_campaign import PLAN, ROOT, verify_source_lock
          plan = json.loads(PLAN.read_text())
          verify_source_lock(plan, ROOT)
          runners = {'x64': 'ubuntu-24.04', 'arm64': 'ubuntu-24.04-arm'}
          jobs = []
          for shard in range(plan['shards_per_configuration']):
              for architecture in plan['architectures']:
                  for mode in plan['oracle_modes']:
                      jobs.append({'architecture': architecture, 'runner': runners[architecture], 'mode': mode, 'shard': shard})
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('matrix=' + json.dumps({'include': jobs}) + '\n')
          PY
  fuzz:
    needs: plan
    name: ${{ matrix.architecture }} / ${{ matrix.mode }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Install and verify the pinned compiler series
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 llvm-22 libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Fetch the pinned comparison oracle
        run: |
          git init build-campaign-oracle
          git -C build-campaign-oracle remote add origin https://github.com/madler/zlib.git
          git -C build-campaign-oracle fetch --depth 1 origin 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          git -C build-campaign-oracle checkout --detach FETCH_HEAD
      - name: Run the bounded shard with sanitizer and coverage evidence
        run: python3 -B tools/run_inflate_campaign.py --oracle build-campaign-oracle --output build-inflate-campaign --oracle-mode ${{ matrix.mode }} --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inflate-evidence-${{ matrix.architecture }}-${{ matrix.mode }}-${{ matrix.shard }}
          path: build-inflate-campaign/evidence
          if-no-files-found: warn
          retention-days: 30
  account:
    needs: [plan, fuzz]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: inflate-evidence-*
          path: campaign-evidence
      - name: Account only intact, complete shards from the locked source
        run: python3 -B tools/check_inflate_campaign.py --evidence campaign-evidence --output campaign-accounting.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inflate-campaign-accounting
          path: campaign-accounting.json
          retention-days: 30
