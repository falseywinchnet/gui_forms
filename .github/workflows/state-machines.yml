name: State-machine gate
# House style section 9 for new code (owner, 2026-10-23): fails on any F1
# (switch without a default, not in the compliant form) or F2 (a default
# that hides enumerators without a stated reason) in the translation units a
# change can affect. template_harness's harness/check_state_machines.py
# (at the commit gui_forms/harness.lock pins) documents the rules;
# notes:results/2026-10-25-state-machine-hunt-2/README.md records the gate.
#
# Scopes: a pull request checks the translation units its C and C++ changes
# can affect (check_state_machines.py --changed-from), and passes at once when
# it changes none; a merge group does the same against the main commit it
# extends, and a push to main against the commit it replaced. The daily
# schedule (native.yml's cron) and a manual run check the whole tree, as does
# any change to the checker itself.
#
# One host (Linux, the cheapest) with the shared engine and no native host
# or Skia: it compiles the core, controls, demo, tests, audio, the stx
# libraries and the fuzz targets. Host adapters and the Skia renderer are
# read by C1 to C3 only here; the daily full-tree run covers what its tree
# compiles.
on:
  pull_request:
  # The merge queue's required check runs on each merge group's temporary
  # branch, under the same name.
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
# The daily schedule has its own group, so it and a push to main never
# cancel each other.
concurrency:
  group: state-machines-${{ github.event_name == 'schedule' && 'daily' || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  state-machines:
    name: state-machine-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # The whole history, so the changed paths are taken from the merge base
      # (tools/change_selection.py). A pull request checks out its test merge
      # commit; a merge group or a push its own commit.
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          fetch-depth: 0
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the checker (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The checker's own fixtures (rules, tuning, the changed-code scope).
      - name: Test the checker
        run: python3 -B -m unittest discover -s template_harness/harness -p test_state_machines.py
      # A pull request compares with its base, a merge group with the main
      # commit it extends, a push to main with the commit it replaced. The schedule, a manual run and a push without a usable
      # base check the whole tree, as does a change to the checker itself.
      - name: Find the changed C and C++ files
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          scope=full
          if [ "$GITHUB_EVENT_NAME" != schedule ] && [ -n "$BASE" ] && git -C gui_forms cat-file -e "$BASE^{commit}" 2>/dev/null; then
            listed=$(python3 -B template_harness/harness/check_state_machines.py --root gui_forms \
              --changed-from "$BASE" --list-changed)
            if [ -z "$listed" ]; then
              scope=none
            elif [ "$listed" != every ]; then
              scope=changed
            fi
            printf '%s\n' "$listed"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "State-machine gate scope: $scope"
      - name: Nothing to check
        if: steps.scope.outputs.scope == 'none'
        run: echo "No C or C++ file changed; the gate passes without a tree."
      - name: Install LLVM 22 and Ninja
        if: steps.scope.outputs.scope != 'none'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 ninja-build
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      # Configure only: the checker runs the front end (-fsyntax-only) over the
      # tree's compile commands and builds just the generated headers.
      - name: Configure the tree
        if: steps.scope.outputs.scope != 'none'
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
          cmake -S gui_forms -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/gui_forms/cmake/llvm22.cmake" \
            -DGUI_FORMS_BUILD_GALLERY=ON -DGUI_FORMS_BUILD_TESTS=ON -DGUI_FORMS_BUILD_AUDIO=ON \
            -DGUI_FORMS_AUDIO_VORBIS_BACKEND=stx \
            -DGUI_FORMS_ENABLE_WINDOWS_HOST=OFF -DGUI_FORMS_ENABLE_MACOS_HOST=OFF \
            -DGUI_FORMS_ENABLE_LINUX_HOST=OFF -DGUI_FORMS_ENABLE_SKIA=OFF -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON
      - name: Check the state machines
        if: steps.scope.outputs.scope != 'none'
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          set -o pipefail
          changed=""
          if [ "$SCOPE" = changed ]; then
            changed="--changed-from $BASE"
          fi
          python3 -B template_harness/harness/check_state_machines.py --root gui_forms --build-dir build --jobs 4 \
            --gate --json state-machines.json $changed | tee state-machines.txt
      - name: Show the findings
        if: always() && steps.scope.outputs.scope != 'none'
        run: |
          if [ -f state-machines.txt ]; then
            { echo '```text'; head -200 state-machines.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.scope != 'none'
        with:
          name: state-machine-findings
          path: |
            state-machines.json
            state-machines.txt
          if-no-files-found: ignore
