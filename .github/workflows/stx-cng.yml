name: stx_cng standalone
on:
  push:
    branches: [main]
    paths: ['stx_cng/**', 'stx_zlib/**', '.github/workflows/stx-cng.yml', 'tools/windows_toolchain*']
  pull_request:
    paths: ['stx_cng/**', 'stx_zlib/**', '.github/workflows/stx-cng.yml', 'tools/windows_toolchain*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stx-cng-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            shell: bash
          - runner: ubuntu-24.04
            shell: bash
          - runner: ubuntu-24.04-arm
            shell: bash
          - runner: windows-2022
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22 cmake ninja
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev cmake ninja-build
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      # The pinned LLVM 22.1.8 CLANG64 toolchain of tools/windows_toolchain.json
      # (clang, lld, cmake, ninja, python), never the current MSYS2 packages:
      # without a published archive the job stops with ToolchainUnavailable.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Restore the pinned Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" tools/windows_toolchain.py restore'
      # Zstandard 1.5.7's release tarball, verified against its pinned SHA-256
      # by the script and again by configuration.
      - name: Fetch the pinned Zstandard
        shell: bash
        run: sh stx_cng/tools/fetch_zstd.sh
      - name: Compile and test
        run: |
          set -eu
          clang++ --version
          python -B tools/check_house_style.py stx_cng
          python -B tools/check_lifetime_rules.py stx_cng
          sdk="$GITHUB_WORKSPACE/.build/stx-cng-sdk"
          common="-G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
          cmake -S stx_zlib -B .build/stx-zlib $common -DCMAKE_BUILD_TYPE=Release -DSTX_ZLIB_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$sdk"
          cmake --build .build/stx-zlib --parallel 4
          cmake --install .build/stx-zlib
          cmake -S stx_cng -B .build/stx-cng $common -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$sdk"
          cmake --build .build/stx-cng --parallel 4
          ctest --test-dir .build/stx-cng --output-on-failure --no-tests=error
      # Installation and the relocated consumer run with the other stx
      # packages (stx-packages.yml).
      - name: Deterministic sanitizer suite
        # ASan and UBSan over the library, Zstandard and the tests; leak
        # detection where the runtime has it (not the MinGW runtime on
        # Windows). Every report stops its test.
        run: |
          set -eu
          sdk="$GITHUB_WORKSPACE/.build/stx-cng-sdk"
          cmake -S stx_cng -B .build/stx-cng-sanitize -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTX_CNG_SANITIZE=ON -DCMAKE_PREFIX_PATH="$sdk"
          cmake --build .build/stx-cng-sanitize --parallel 4
          leaks=1
          if [ "$RUNNER_OS" = Windows ]; then leaks=0; fi
          ASAN_OPTIONS="detect_leaks=$leaks:halt_on_error=1" UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1" \
            ctest --test-dir .build/stx-cng-sanitize --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stx-cng-${{ matrix.runner }}
          path: |
            .build/stx-cng/Testing/Temporary/LastTest.log
            .build/stx-cng-sanitize/Testing/Temporary/LastTest.log
