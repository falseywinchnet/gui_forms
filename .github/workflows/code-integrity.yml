name: Code integrity
# Report mode for code_integrity_checker/check.py (Phase E, E1): every
# candidate is printed, and the job fails only on a raised one, a candidate
# that no recognized guard protects and no decision in
# code_integrity_checker/reviews.json covers. Guarded, reviewed and ignored
# (Skia) candidates are listed apart. The full report is kept as an artifact.
#
# A text scan of include/ and src/ on one Linux host: no build is needed.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: code-integrity-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  code-integrity:
    name: code-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the checker
        run: python3 -B -m unittest discover -s code_integrity_checker -p test_check.py
      - name: Check include and src
        run: python3 -B code_integrity_checker/check.py include src --gate --json build/code-integrity.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-integrity-report
          path: build/code-integrity.json
          if-no-files-found: ignore
          retention-days: 14
