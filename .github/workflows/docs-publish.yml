name: Documentation publication
# Read the Docs builds only documentation CI has passed (owner, 2026-10-27).
# Its own push and pull-request builds are switched off on the Read the Docs
# side, and this workflow asks it for a build through the API v3
# (tools/readthedocs_build.py, with the repository secret READTHEDOCS_TOKEN):
# - `latest` after native.yml ("GUI.Forms source and compiler cache")
#   succeeds on a push to main;
# - `stable` after release.yml ("GUI.Forms programs and release") succeeds
#   on a pushed v* tag.
# A push to main that publishes a release creates its v* tag through the
# API, which starts no workflow. Read the Docs moves `stable` to the newest
# version tag when the `latest` build syncs the repository's tags
# (docs/release/index.md).
#
# workflow_run filters by head_branch, which is the tag's name for a tag run;
# each job names the workflow, event and branch it accepts.
on:
  workflow_run:
    workflows: ["GUI.Forms source and compiler cache", "GUI.Forms programs and release"]
    types: [completed]
    branches: [main, 'v*']
permissions:
  contents: read
jobs:
  latest:
    if: >-
      github.event.workflow_run.name == 'GUI.Forms source and compiler cache'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the latest documentation on Read the Docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: python3 -B tools/readthedocs_build.py --version latest
  stable:
    if: >-
      github.event.workflow_run.name == 'GUI.Forms programs and release'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build the stable documentation on Read the Docs
        env:
          READTHEDOCS_TOKEN: ${{ secrets.READTHEDOCS_TOKEN }}
        run: python3 -B tools/readthedocs_build.py --version stable
