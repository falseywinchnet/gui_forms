name: Codec fuzz smoke
# A few minutes of libFuzzer per target per change, on GitHub's runners only:
# a cheap build check that surfaces broken contracts quickly. It is not a
# certificate and never runs on the owner's machine (owner revision of
# decision 6A, 2026-10-20). The deterministic malformed-input sweeps in the
# normal suite and the whole-suite sanitizer job carry the evidence.
on:
  pull_request:
    paths:
      - 'stx_zlib/**'
      - 'stx_png/**'
      - 'stx_conv/**'
      - 'stx_cng/**'
      - 'stx_rtf2md/**'
      - 'src/core/image/**'
      - 'include/gui_forms/compression/**'
      - 'fuzz/**'
      - 'tests/compression/oracle_sha256.json'
      - '.github/workflows/fuzz-smoke.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    name: ${{ matrix.target }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        target: [inflate, inflate_oracle_ordinary, inflate_oracle_strict, inflate_protocol, deflate, png_decode, conv, cng, rtf2md_markdown, rtf2md_rtf]
        include:
          - architecture: x64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    env:
      SMOKE_SECONDS: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned compiler series
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Fetch and verify the pinned zlib oracle
        if: startsWith(matrix.target, 'inflate_oracle')
        run: |
          git init oracle
          git -C oracle remote add origin https://github.com/madler/zlib.git
          git -C oracle fetch --depth 1 origin 51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf
          git -C oracle checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path('tests/compression/oracle_sha256.json').read_text())
          for name, expected in manifest['files'].items():
              actual = hashlib.sha256((pathlib.Path('oracle') / name).read_bytes()).hexdigest()
              if actual != expected:
                  sys.exit('oracle hash mismatch: ' + name)
          PY
      # Zstandard 1.5.7 for the cng target: the pinned release tarball, built
      # with the codec through its own CMake profile (stx_cng/cmake/zstd.cmake)
      # under the same instrumentation; stx_zlib supplies CRC-32.
      - name: Build the CNG libraries
        if: matrix.target == 'cng'
        run: |
          set -eu
          sh stx_cng/tools/fetch_zstd.sh
          instrument="-O1 -g -fsanitize=fuzzer-no-link,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer"
          sdk="$GITHUB_WORKSPACE/.build/cng-fuzz-sdk"
          common="-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=None"
          cmake -S stx_zlib -B .build/cng-fuzz-zlib $common -DCMAKE_CXX_FLAGS="$instrument" -DSTX_ZLIB_TESTS=OFF -DCMAKE_INSTALL_PREFIX="$sdk"
          cmake --build .build/cng-fuzz-zlib --parallel 4
          cmake --install .build/cng-fuzz-zlib
          cmake -S stx_cng -B .build/cng-fuzz $common -DCMAKE_C_FLAGS="$instrument" -DCMAKE_CXX_FLAGS="$instrument" \
            -DSTX_CNG_TESTS=OFF -DCMAKE_PREFIX_PATH="$sdk"
          cmake --build .build/cng-fuzz --parallel 4
      - name: Build the target
        run: |
          set -eu
          flags="-std=c++20 -O1 -g -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -Iinclude -Istx_zlib/include"
          case "${{ matrix.target }}" in
            inflate) clang++ $flags fuzz/inflate_fuzz.cpp stx_zlib/src/inflate.cpp stx_zlib/src/checksum.cpp -o smoke ;;
            inflate_oracle_*)
              mode=""
              if [ "${{ matrix.target }}" = inflate_oracle_strict ]; then mode=-DINFLATE_STRICT; fi
              objects=""
              for name in adler32 crc32 deflate inflate inffast inftrees trees zutil; do
                clang -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer $mode -Ioracle -c oracle/$name.c -o $name.o
                objects="$objects $name.o"
              done
              clang++ $flags -Ioracle -DGUI_FORMS_INFLATE_ORACLE=1 fuzz/inflate_fuzz.cpp stx_zlib/src/inflate.cpp stx_zlib/src/checksum.cpp $objects -o smoke ;;
            inflate_protocol) clang++ $flags fuzz/inflate_protocol_fuzz.cpp stx_zlib/src/inflate.cpp stx_zlib/src/checksum.cpp -o smoke ;;
            deflate) clang++ $flags fuzz/deflate_fuzz.cpp stx_zlib/src/inflate.cpp stx_zlib/src/checksum.cpp stx_zlib/src/deflate.cpp -o smoke ;;
            rtf2md_markdown) clang++ $flags -Istx_rtf2md/include -Istx_rtf2md/src stx_rtf2md/fuzz/markdown_round_trip_fuzz.cpp \
                   stx_rtf2md/src/document.cpp stx_rtf2md/src/limits.cpp stx_rtf2md/src/text_scan.cpp \
                   stx_rtf2md/src/markdown_inline.cpp stx_rtf2md/src/markdown_reader.cpp stx_rtf2md/src/markdown_writer.cpp \
                   stx_rtf2md/src/rtf_reader.cpp -o smoke ;;
            rtf2md_rtf) clang++ $flags -Istx_rtf2md/include -Istx_rtf2md/src stx_rtf2md/fuzz/rtf_read_fuzz.cpp \
                   stx_rtf2md/src/document.cpp stx_rtf2md/src/limits.cpp stx_rtf2md/src/text_scan.cpp \
                   stx_rtf2md/src/markdown_inline.cpp stx_rtf2md/src/markdown_reader.cpp stx_rtf2md/src/markdown_writer.cpp \
                   stx_rtf2md/src/rtf_reader.cpp -o smoke ;;
            conv) clang++ $flags -Istx_conv/include stx_conv/fuzz/conv_fuzz.cpp stx_conv/src/plan.cpp stx_conv/src/profile.cpp stx_conv/src/image.cpp -o smoke ;;
            cng) clang++ $flags -Istx_cng/include stx_cng/fuzz/cng_fuzz.cpp .build/cng-fuzz/libstx_cng.a \
                   .build/cng-fuzz/libstx_cng_zstd.a .build/cng-fuzz-zlib/libstx_zlib.a -o smoke ;;
            png_decode) clang++ $flags -Istx_png/include fuzz/png_decode_fuzz.cpp stx_png/src/decoder.cpp stx_png/src/encoder.cpp stx_zlib/src/inflate.cpp stx_zlib/src/checksum.cpp stx_zlib/src/deflate.cpp -o smoke ;;
          esac
      - name: Run the smoke
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -eu
          mkdir -p corpus failures
          case "${{ matrix.target }}" in
            inflate*) cp fuzz/corpus/inflate/* corpus/ ;;
            rtf2md_rtf) cp stx_rtf2md/tests/corpus/*.rtf corpus/ ;;
          esac
          seed=20261020
          if [ "${{ matrix.architecture }}" = arm64 ]; then seed=20261021; fi
          ./smoke -seed=$seed -max_total_time=$SMOKE_SECONDS -max_len=65536 -timeout=20 \
            -rss_limit_mb=2048 -artifact_prefix=failures/ -print_final_stats=1 corpus
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-smoke-failures-${{ matrix.target }}-${{ matrix.architecture }}
          path: failures
          if-no-files-found: ignore
          retention-days: 14
