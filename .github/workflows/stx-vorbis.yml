name: stx_vorbis standalone
on:
  pull_request:
    paths: ['stx_vorbis/**', '.github/workflows/stx-vorbis.yml', 'harness.lock']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stx-vorbis-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            shell: bash
          - runner: ubuntu-24.04
            shell: bash
          - runner: ubuntu-24.04-arm
            shell: bash
          - runner: windows-2022
            shell: 'msys2 {0}'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      # template_harness at the commit harness.lock pins, at ./template_harness
      # in this root checkout: the toolchain restore and the checkers.
      - uses: ./.github/actions/harness-checkout
        with:
          product-path: .
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22 cmake ninja pkg-config libvorbis
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 libclang-rt-22-dev cmake ninja-build pkg-config libvorbis-dev libogg-dev
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      # The pinned LLVM 22.1.8 CLANG64 toolchain of the harness's windows_toolchain.json
      # (clang, lld, cmake, ninja, python), never the current MSYS2 packages:
      # without a published archive the job stops with ToolchainUnavailable.
      # That toolchain has no libvorbis or pkgconf, so Windows builds without
      # the libvorbis oracle (STX_VORBIS_REFERENCE) and skips the two oracle
      # comparisons; macOS and both Linux runners still run them.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Restore the pinned Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py restore'
      - name: Compile and test the independent library
        run: |
          clang++ --version
          python template_harness/harness/check_house_style.py stx_vorbis
          reference=ON
          if [ "$RUNNER_OS" = Windows ]; then reference=OFF; fi
          cmake -S stx_vorbis -B .build/stx-vorbis -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DSTX_VORBIS_REFERENCE=$reference -DSTX_VORBIS_BENCHMARKS=ON
          cmake --build .build/stx-vorbis --parallel 4
          ctest --test-dir .build/stx-vorbis --output-on-failure
          if [ "$reference" = ON ]; then
            python stx_vorbis/tools/differential.py --build .build/stx-vorbis --work .build/stx-differential
          fi
      - name: Validate production PCM and relocated installed consumer
        run: |
          decoder=.build/stx-vorbis/stx_vorbis_decode
          if [ "$RUNNER_OS" = Windows ]; then decoder="$decoder.exe"; fi
          if [ "$RUNNER_OS" != Windows ]; then
            python stx_vorbis/bench/bfft/check_pcm.py --build .build/stx-vorbis --baseline "$decoder" --baseline-scalar --input stx_vorbis/bench/corpus/stereo-10s.ogg stx_vorbis/bench/corpus/surround-10s.ogg --output .build/stx-production-pcm
          fi
          cmake --install .build/stx-vorbis --prefix "$GITHUB_WORKSPACE/.build/stx-sdk-original"
          mv .build/stx-sdk-original .build/stx-sdk-relocated
          test -f .build/stx-sdk-relocated/share/licenses/stx_vorbis/BFFT-LICENSE.txt
          test -f .build/stx-sdk-relocated/share/licenses/stx_vorbis/BFFT-provenance.json
          cmake -S stx_vorbis/tests/installed -B .build/stx-installed-test -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/.build/stx-sdk-relocated"
          cmake --build .build/stx-installed-test --parallel 4
          ctest --test-dir .build/stx-installed-test --output-on-failure
      - name: Sanitizers and independent fuzz stages
        if: runner.os == 'Linux'
        run: |
          cmake -S stx_vorbis -B .build/stx-sanitize -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DSTX_VORBIS_SANITIZERS=ON -DSTX_VORBIS_FUZZ=ON
          cmake --build .build/stx-sanitize --parallel 4
          ctest --test-dir .build/stx-sanitize --output-on-failure
          python stx_vorbis/tools/seed_fuzz.py .build/stx-seeds stx_vorbis/tests/corpus/*.ogg .build/stx-differential/*.ogg
          for stage in bits ogg huffman setup packet decoder; do
            .build/stx-sanitize/stx_fuzz_$stage .build/stx-seeds/$stage -max_total_time=15 -timeout=5 -rss_limit_mb=1024 -print_final_stats=1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stx-vorbis-${{ matrix.runner }}
          path: |
            .build/stx-differential/differential-results.json
            .build/stx-vorbis/Testing/Temporary/LastTest.log
            .build/stx-sanitize/Testing/Temporary/LastTest.log
            .build/stx-installed-test/Testing/Temporary/LastTest.log
            .build/stx-production-pcm/pcm.json
