name: Compiler cache mechanism proof
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gui-cache-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - name: Install LLVM 22 and cache tools
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm-key.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm-key.asc" /usr/share/keyrings/apt-llvm.asc
          echo 'deb [signed-by=/usr/share/keyrings/apt-llvm.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache clang-22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - name: Require the supported compiler
        run: python3 gui_forms/tools/compiler_identity.py
      - name: Prove cold, relocated, source, header and option behavior
        run: python3 gui_forms/tools/prove_compiler_cache.py --source gui_forms --scratch cache-proof --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-cache-proof-linux-x64
          path: |
            cache-proof/receipt.json
            cache-proof/**/*.log
