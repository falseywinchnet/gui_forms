name: GUI.Forms source and compiler cache
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each merge group runs every required check, under the
  # same names, on its temporary gh-readonly-queue/main/... branch, whose
  # commit main then becomes. It publishes nothing and saves no Actions cache
  # (its branch's caches reach no other ref); the push to main that follows
  # carries its validation, receipts and programs tests.
  merge_group:
  # The daily full run on main reuses nothing: every native job validates
  # afresh, and the programs, Sanitizers and docs jobs build and test
  # everything. It is the backstop for what a push to main carries from the
  # merged pull request's run (tools/release_tests.py, tools/ci_tree_receipt.py):
  # the name match of tools/native_tests.py and the change selection of
  # tools/change_selection.py. It publishes nothing.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      force_validation:
        description: Run native validation even if an identical successful receipt exists
        type: boolean
        default: false
      package_windows_toolchain:
        description: Install and package a new Windows toolchain when none is published for the harness's windows_toolchain.json
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  # The daily schedule has its own group, so it and a push to main never
  # cancel each other. A newer push to a branch cancels the branch's older
  # run, but a push to main waits for the previous main run: that run
  # publishes its release and leaves the receipts a tag carries.
  group: gui-forms-${{ github.event_name == 'schedule' && 'daily' || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  house-style:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui_forms
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The pinned harness's own tests (the checkers, the reuse, cache and
      # toolchain tools GUI.Forms moved there), then the forwarding shims at
      # the old tool paths: template_harness has no CI of its own yet.
      - name: Check the pinned harness and the shims that reach it
        run: |
          python3 -B -m unittest discover -s ../template_harness/harness -p "test_*.py"
          python3 -B -m unittest discover -s tools -p test_harness_shims.py
      - name: Check scanner fixtures and corrected authoring scope
        run: |
          python3 -B -m unittest discover -s tools -p test_readthedocs_build.py
          python3 -B -m unittest discover -s tools -p test_skia_archive.py
          python3 -B -m unittest discover -s tools -p test_stack_frames.py
          python3 -B -m unittest discover -s tools -p test_control_registry.py
          python3 tools/control_registry.py check
          python3 tools/control_registry.py emit-cpp --check
          python3 -B -m unittest discover -s tools -p test_control_schema.py
          python3 tools/control_schema.py check
          python3 tools/control_schema.py render --check
          python3 -B -m unittest discover -s tools -p test_generate_library_docs.py
          python3 tools/generate_library_docs.py --check
          python3 -B ../template_harness/harness/check_house_style.py include src demo tests examples tools file_manager_demoboard stx_vorbis stx_zlib stx_png stx_conv stx_rtf2md fuzz
          python3 -B -m unittest discover -s tools -p test_ci_build.py
          python3 -B -m unittest discover -s tools -p test_engine_gate.py
          python3 -B -m unittest discover -s tools/layout_oracle -p test_layout_oracle.py
          python3 -B ../template_harness/harness/check_lifetime_rules.py include src demo tests examples tools file_manager_demoboard stx_vorbis stx_zlib stx_png stx_conv stx_rtf2md fuzz
  # The site depends only on the tree (docs/requirements.txt pins its
  # toolchain), so a tree an earlier run of this repository built passes
  # without building it again (tools/ci_tree_receipt.py); the job still
  # reports success under its own name. The daily schedule always builds.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find an earlier build of this tree's documentation
        id: receipt
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 template_harness/harness/ci_tree_receipt.py lookup --kind docs --job docs
      - name: Install the documentation toolchain
        if: steps.receipt.outputs.reused != 'true'
        run: python3 -m pip install -r gui_forms/docs/requirements.txt
      - name: Build the documentation site with warnings as errors
        if: steps.receipt.outputs.reused != 'true'
        working-directory: gui_forms
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        if: steps.receipt.outputs.reused != 'true'
        with:
          name: gui-forms-docs-html
          path: gui_forms/docs/_build/html
          retention-days: 30
      # A job that reused a build records the run it carried.
      - name: Record this tree's documentation build
        id: record
        env:
          CARRIED: ${{ steps.receipt.outputs.producer-run }}
          COVERAGE: ${{ steps.receipt.outputs.coverage }}
        run: python3 template_harness/harness/ci_tree_receipt.py write --kind docs --out .ci/tree-receipt ${CARRIED:+--carried-from "$CARRIED" --coverage "$COVERAGE"}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: .ci/tree-receipt/receipt.json
          retention-days: 30
  # House style section 5: memory errors and undefined behaviour are defects,
  # tests included. The suite (on a pull request, the tests its changes can
  # affect) runs under AddressSanitizer, UndefinedBehaviorSanitizer and
  # LeakSanitizer; any report stops its test and fails the job. Make it a
  # required check on main (branch protection).
  sanitizers:
    name: Sanitizers (Linux, ASan + UBSan + LSan)
    needs: house-style
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      # One tree per job: a pull_request run takes its workflow files from the
      # test merge commit (refs/pull/N/merge), so the job checks out that same
      # commit (the default ref), never the head alone, whose older tree may
      # lack tools main's workflow calls. A push or a merge group checks out
      # its own commit. The whole history, so a pull request's or a merge
      # group's changed paths are taken from its merge base
      # (tools/change_selection.py).
      - uses: actions/checkout@v4
        with:
          path: gui_forms
          fetch-depth: 0
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the shared CI tools and checkers (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # A push to main is the commit of the merge group that tested it (or,
      # merged without the queue, has the tree of the up-to-date pull request
      # it merges), whose run passed this job on the tests its changed paths
      # can affect (owner's choice, 2026-10-23: the sanitizers need to run
      # only on new code). A merge group with its pull request's tree carries
      # that run's receipt the same way. The job then carries that run's receipt, builds and tests
      # nothing, and passes under its own name (tools/ci_tree_receipt.py). The
      # daily schedule looks up nothing and runs the whole suite, the backstop
      # for tools/change_selection.py.
      - name: Find an earlier run that passed this tree
        id: receipt
        if: github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_tree_receipt.py lookup --kind sanitize --job "Sanitizers (Linux, ASan + UBSan + LSan)"
      # The Ubuntu mirror is sometimes slow (7-11 minutes for 30 MB), so the
      # downloaded Ubuntu packages are kept in an Actions cache, refreshed once
      # per runner image; only main saves it (harness/install_linux_ci_packages.sh).
      - name: Name the Linux package cache
        if: steps.receipt.outputs.reused != 'true'
        id: linux-image
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.receipt.outputs.reused != 'true'
        id: linux-packages
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-
      - name: Install Linux dependencies
        if: steps.receipt.outputs.reused != 'true'
        run: sh template_harness/harness/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.linux-packages.outputs.cache-hit != 'true' && steps.receipt.outputs.reused != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      - name: Configure compiler cache
        if: steps.receipt.outputs.reused != 'true'
        run: |
          echo "CCACHE_DIR=$PWD/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=1G" >> "$GITHUB_ENV"
          # Before the cache is restored: tools/ci_cache.py evict keeps the
          # entries used after this moment.
          echo "GUI_FORMS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      # Line tables by default; [sanitizer-full-g] in the head commit's message
      # selects -g for a hunt (tools/ci_build.py --debug-info). The checkout is
      # a pull request's merge commit, so the message is read from the head
      # commit by name (the full history holds it); a push reads its own.
      - name: Choose the sanitizer debug information
        if: steps.receipt.outputs.reused != 'true'
        id: debug-info
        env:
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mode=lines
          if git -C gui_forms log -1 --format=%B "$HEAD_COMMIT" | grep -qF '[sanitizer-full-g]'; then
            mode=full
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "GUI_FORMS_SANITIZER_DEBUG_INFO=$mode" >> "$GITHUB_ENV"
          echo "Sanitizer debug information: $mode"
      # Pull requests restore main's cache and never save one: a new 600 MB
      # entry per run evicted the dependency and object caches from the
      # repository's 10 GB. Objects of a branch's own earlier push, of the
      # branch a pull request is stacked on, or (on main) of the merged pull
      # request come from the seed artifact below instead. The debug-information
      # mode is in the key, so line-table and full objects never share an entry,
      # and only line-table runs find or pack a seed: a full -g hunt starts from
      # main's cache and leaves no seed behind for a line-table run to restore.
      - uses: actions/cache/restore@v4
        if: steps.receipt.outputs.reused != 'true'
        id: sanitizer-cache
        with:
          path: |
            .ccache
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-linux-x64/skia
          key: gui-sanitize-v1-${{ steps.debug-info.outputs.mode }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn') }}-${{ github.sha }}
          restore-keys: |
            gui-sanitize-v1-${{ steps.debug-info.outputs.mode }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn') }}-
      - name: Find sanitizer objects of the nearest branch
        id: seed
        if: steps.debug-info.outputs.mode == 'lines' && steps.receipt.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_sanitizer_seed.py find
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.seeded == 'true' && steps.receipt.outputs.reused != 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.producer-run }}
          artifact-ids: ${{ steps.seed.outputs.artifact-id }}
          path: .ci/sanitizer-seed
          merge-multiple: true
      - name: Replace the restored objects with the seed (every test still runs)
        if: steps.seed.outputs.seeded == 'true' && steps.receipt.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_sanitizer_seed.py restore --artifact-id "${{ steps.seed.outputs.artifact-id }}"
      # A pull request builds and runs only the tests its changed paths can
      # affect (the areas of tools/test_areas.json; every test when it touches
      # CMake, the toolchain, the core headers or this workflow); a merge
      # group does the same from the main commit it extends. A push to main
      # that carried no receipt runs the whole suite.
      - name: Build and test under the sanitizers
        if: steps.receipt.outputs.reused != 'true'
        env:
          CHANGED_FROM: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          ccache --zero-stats
          selection=""
          if [ -n "$CHANGED_FROM" ]; then
            selection="--changed-from $CHANGED_FROM"
          fi
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python gui_forms/tools/ci_build.py --jobs 4 --sanitize $selection
      # No first-party function may need a stack frame over 256 KB under the
      # sanitizers: AddressSanitizer's redzones grew test mains to hundreds of KB
      # on Windows, and a chain of them overflowed theme_tests' 1 MB main
      # thread (#283). Reads the prologues of the objects this run built, so
      # a narrowed pull-request build checks the areas it changed. Runs after
      # a failed test too: an overflow fails as a crash, which this names.
      # A run that built nothing (a change no test reads, such as a
      # documentation-only one) passes: ci_build.py's build record says so.
      - name: Check stack frames
        if: ${{ !cancelled() && steps.receipt.outputs.reused != 'true' }}
        run: python gui_forms/tools/stack_frames.py check --tree .build/native-linux-x64/gui-forms-sanitize --jobs 4 --top 15
      - name: Report cache statistics
        if: always() && steps.receipt.outputs.reused != 'true'
        run: ccache --show-stats --verbose
      # What passed this tree: this run's build record, or the run it carried.
      - name: Record this tree's sanitizer run
        id: record
        if: success()
        env:
          CARRIED: ${{ steps.receipt.outputs.producer-run }}
          COVERAGE: ${{ steps.receipt.outputs.coverage }}
        run: python template_harness/harness/ci_tree_receipt.py write --kind sanitize --out .ci/tree-receipt --build-record .build/native-linux-x64/gui-forms-sanitize.record.json ${CARRIED:+--carried-from "$CARRIED" --coverage "$COVERAGE"}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ steps.record.outputs.artifact }}
          path: .ci/tree-receipt/receipt.json
          retention-days: 30
      - name: Pack the sanitizer objects as the next run's seed
        if: success() && steps.debug-info.outputs.mode == 'lines' && steps.receipt.outputs.reused != 'true'
        run: python template_harness/harness/ci_sanitizer_seed.py pack
      - uses: actions/upload-artifact@v4
        if: success() && steps.debug-info.outputs.mode == 'lines' && steps.receipt.outputs.reused != 'true'
        with:
          name: gui-sanitize-ccache-linux-x64
          path: |
            gui-sanitize-ccache.tar
            gui-sanitize-ccache.tar.sha256
          compression-level: 0
          retention-days: 7
      # The saved cache is this build's working set, not every generation up
      # to CCACHE_MAXSIZE (notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 1). Main
      # saves it when it builds everything: the daily schedule, and a push
      # that carried no pull request's receipt.
      - name: Keep only the compiler cache entries this build used
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.receipt.outputs.reused != 'true'
        run: python template_harness/harness/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      - uses: actions/cache/save@v4
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.receipt.outputs.reused != 'true'
        with:
          path: |
            .ccache
            gui_forms/third_party/skia
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            .build/native-linux-x64/skia
          key: ${{ steps.sanitizer-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-test-log
          path: .build/native-linux-x64/gui-forms-sanitize/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 14

  native-macos-arm64:
    name: native (macos-15, macos-arm64, bash)
    needs: house-style
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: macos-15
      platform: macos-arm64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || github.event_name == 'schedule' }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
    permissions:
      contents: write
      actions: read

  native-linux-x64:
    name: native (ubuntu-24.04, linux-x64, bash)
    needs: house-style
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04
      platform: linux-x64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || github.event_name == 'schedule' }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
    permissions:
      contents: write
      actions: read

  native-linux-arm64:
    name: native (ubuntu-24.04-arm, linux-arm64, bash)
    needs: house-style
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: ubuntu-24.04-arm
      platform: linux-arm64
      shell: bash
      force_validation: ${{ inputs.force_validation == true || github.event_name == 'schedule' }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
    permissions:
      contents: write
      actions: read

  # Stage SK1: the Windows CPU Skia archive (tools/skia_archive.py). The plan
  # job reads the pin and the artifacts; the build job runs only when no
  # archive of the current identity is pinned or uploaded, with its own limit
  # sized for a cold Skia build. Steady-state runs skip it, and the native
  # Windows job keeps its own limit: it fetches the archive.
  skia-windows-x64-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      identity: ${{ steps.plan.outputs.identity }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # The archive's identity reads the toolchain pin from the harness.
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Decide whether the Windows CPU Skia archive must be built
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B gui_forms/tools/skia_archive.py plan --platform windows-x64

  # The job always runs. When the plan finds an archive of this identity, it
  # is a no-op on Ubuntu. A skipped job here would make GitHub skip, or report
  # as skipped, the jobs after it (programs-windows-x64, publish, engine-gate),
  # even though native-windows-x64 itself runs.
  skia-windows-x64:
    needs: skia-windows-x64-plan
    runs-on: ${{ needs.skia-windows-x64-plan.outputs.build == 'true' && 'windows-2022' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      GUI_FORMS_RUNNER: windows-2022
      CC: clang
      CXX: clang++
    defaults:
      run:
        shell: 'msys2 {0}'
    steps:
      - name: No archive to build
        if: needs.skia-windows-x64-plan.outputs.build != 'true'
        shell: bash
        run: echo "An archive of identity ${{ needs.skia-windows-x64-plan.outputs.identity }} is pinned or uploaded; nothing to build."
      - uses: actions/checkout@v4
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
      - uses: actions/setup-python@v5
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
        id: toolchain-python
        with:
          python-version: '3.14'
          update-environment: false
      - name: Restore the published Windows toolchain without MSYS2 mirrors
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py restore'
      # Natively with the pinned CLANG64 toolchain (BGRA, the profile's
      # spelled-out order); then packed, and compiled against and run from a
      # fresh extraction. The log prints the build's own time.
      - name: Build, pack and probe the Windows CPU Skia archive
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
        id: archive
        env:
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: |
          toolchain_python=$(cygpath -u "$TOOLCHAIN_PYTHON")
          skia_out=.build/native-windows-x64/skia
          started=$(date +%s)
          sh gui_forms/third_party/fetch_skia_cpu.sh
          fetched=$(date +%s)
          sh gui_forms/third_party/build_skia_cpu_windows_mingw.sh "$skia_out"
          built=$(date +%s)
          echo "Skia fetch $((fetched - started)) s, cold build $((built - fetched)) s"
          ls -l "$skia_out"/*.a
          "$toolchain_python" gui_forms/tools/skia_archive.py pack --platform windows-x64 --skia-out "$skia_out"
          "$toolchain_python" gui_forms/tools/skia_archive.py probe --platform windows-x64
      - uses: actions/upload-artifact@v4
        if: needs.skia-windows-x64-plan.outputs.build == 'true'
        with:
          name: ${{ steps.archive.outputs.artifact-name }}
          overwrite: true
          path: |
            gui-forms-skia-windows-x64.tar.zst
            gui-forms-skia-windows-x64.json
          compression-level: 0
          retention-days: 30

  native-windows-x64:
    name: native (windows-2022, windows-x64, msys2 {0})
    needs: [house-style, skia-windows-x64-plan, skia-windows-x64]
    # Runs after the Skia job, which builds an archive or does nothing.
    if: >-
      !cancelled() && needs.house-style.result == 'success'
      && needs.skia-windows-x64-plan.result == 'success' && needs.skia-windows-x64.result == 'success'
    uses: ./.github/workflows/native-platform.yml
    with:
      runner: windows-2022
      platform: windows-x64
      shell: 'msys2 {0}'
      force_validation: ${{ inputs.force_validation == true || github.event_name == 'schedule' }}
      package_windows_toolchain: ${{ inputs.package_windows_toolchain == true }}
    permissions:
      contents: write
      actions: read

  # T2's gate evidence (E11): every native job's engine gate manifest, compared
  # across hosts. Fails on any reference-image hash that differs between hosts,
  # any idle counter above zero, or any host without a manifest (a job that
  # reused a validation carries that run's manifest). The filled record is the
  # t2-engine-gate-record artifact (notes:results/2026-10-22-t2-engine-gate/).
  engine-gate:
    needs: [native-macos-arm64, native-linux-x64, native-linux-arm64, native-windows-x64]
    if: always() && !contains(needs.*.result, 'skipped') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gui-forms-evidence-*
          path: .ci/evidence
      - name: Compare the engine gate manifests across hosts
        run: >-
          python3 -B tools/engine_gate.py compare --evidence .ci/evidence --out .ci/engine-gate
          --commit "${{ github.sha }}"
          --run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Show the record
        if: always()
        run: |
          if [ -f .ci/engine-gate/record.md ]; then cat .ci/engine-gate/record.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t2-engine-gate-record
          include-hidden-files: true
          path: .ci/engine-gate/
          if-no-files-found: warn

  # The demonstration programs, their tests and packages, one platform each,
  # built from that platform's native objects as soon as its native job passes.
  programs-macos-arm64:
    needs: native-macos-arm64
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: macos-arm64
    permissions:
      contents: write
      actions: read

  programs-linux-x64:
    needs: native-linux-x64
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: linux-x64
    permissions:
      contents: write
      actions: read

  programs-linux-arm64:
    needs: native-linux-arm64
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: linux-arm64
    permissions:
      contents: write
      actions: read

  # This job and publish name the results they need instead of relying on an
  # implicit success(), which any skipped job before them turns false.
  programs-windows-x64:
    needs: native-windows-x64
    if: ${{ !cancelled() && needs.native-windows-x64.result == 'success' }}
    uses: ./.github/workflows/release.yml
    with:
      from_native: true
      platform: windows-x64
    permissions:
      contents: write
      actions: read

  # On main, the tested release, once every platform's programs are packaged:
  # a release needs all four.
  publish:
    needs: [programs-macos-arm64, programs-linux-x64, programs-linux-arm64, programs-windows-x64]
    if: >-
      !cancelled()
      && needs.programs-macos-arm64.result == 'success' && needs.programs-linux-x64.result == 'success'
      && needs.programs-linux-arm64.result == 'success' && needs.programs-windows-x64.result == 'success'
      && needs.programs-linux-x64.outputs.publish == 'true'
    uses: ./.github/workflows/publish-release.yml
    with:
      tag: ${{ needs.programs-linux-x64.outputs.tag }}
      version: ${{ needs.programs-linux-x64.outputs.version }}
    permissions:
      contents: write
      actions: read

  # After every job that saves a cache on a push to main: delete the entries
  # each new save superseded, keeping the newest of each family
  # (tools/ci_cache.py prune; notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 2).
  # Runs when a saving job failed too, since the others saved. The only job
  # with actions: write.
  cache-prune:
    needs: [sanitizers, native-macos-arm64, native-linux-x64, native-linux-arm64, native-windows-x64, programs-macos-arm64, programs-linux-x64, programs-linux-arm64, programs-windows-x64]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      - uses: ./gui_forms/.github/actions/harness-checkout
      - name: Delete superseded cache generations
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B template_harness/harness/ci_cache.py prune --ref refs/heads/main --apply
