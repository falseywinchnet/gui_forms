name: Linux hot-path profile
# Phase E, E5's dynamic half: the recorded GUI.Forms workloads under perf
# sampling on linux-x64, published as a hot-path list (every function's share
# of each workload's samples) and a short report. tools/profile_hot_paths.py
# builds the workloads, samples them and writes the list; the workloads are
# benchmarks/paint_profile_workload.cpp (the Gallery through the CPU Skia
# adapter as it is) and the text engine and DocumentView benchmarks.
#
# Shares are fractions of samples, not timings: no run here says anything is
# fast or slow. Its purpose is a before-and-after record: the first runs keep
# the upstream-Skia renderer as the baseline for the stx_skia swap and the
# later hot-loop work (notes:results/<date>-e5-linux-hot-paths).
#
# On schedule and on demand, and on a pull request only when it changes the
# profiler itself (this file, the tool or the paint workload), so a change to
# it is proved before it lands. It builds its own tree with frame pointers,
# so it shares no objects with the native jobs.
on:
  schedule:
    - cron: '23 5 * * 3'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/profile-linux.yml
      - tools/profile_hot_paths.py
      - tools/test_profile_hot_paths.py
      - benchmarks/paint_profile_workload.cpp
permissions:
  contents: read
concurrency:
  group: gui-profile-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  profile:
    name: profile (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GUI_FORMS_RUNNER: ubuntu-24.04
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the toolkit's Linux packages
        run: sh template_harness/harness/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      # perf comes from the runner's own Ubuntu archive, built for its
      # kernel. Sampling needs the kernel to allow it for this user, and
      # kernel symbols need their addresses shown.
      - name: Install perf and allow sampling
        run: |
          sudo apt-get install -y linux-tools-common "linux-tools-$(uname -r)"
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          perf version
      - name: Identify and verify LLVM release compiler
        id: compiler
        run: python template_harness/harness/compiler_identity.py
      # The native jobs' text-stack cache (native-platform.yml), with the
      # same paths so main's entry serves a scheduled run.
      - uses: actions/cache/restore@v4
        with:
          path: |
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native-linux-x64/gui-forms/_deps/gui_forms_miniaudio-src
          key: gui-deps-v3-linux-x64-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn', 'gui_forms/cmake/Audio.cmake') }}
      - name: Configure compiler cache
        run: |
          echo "CCACHE_DIR=$PWD/.ccache-profile" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$PWD" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .ccache-profile
          key: gui-profile-objects-v1-linux-x64-${{ steps.compiler.outputs.identity }}-${{ github.sha }}
          restore-keys: gui-profile-objects-v1-linux-x64-${{ steps.compiler.outputs.identity }}-
      - name: Test the hot-path tool
        run: python3 -B -m unittest discover -s gui_forms/tools -p test_profile_hot_paths.py
      - name: Build, sample and list the hot paths
        run: |
          set -o pipefail
          python3 gui_forms/tools/profile_hot_paths.py run --output hot-paths --jobs 4 | tee hot-paths-run.txt
      - name: Show the hot paths
        if: always()
        run: |
          if [ -f hot-paths/hot-paths.md ]; then
            head -c 60000 hot-paths/hot-paths.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hot-paths-linux-x64
          path: |
            hot-paths
            hot-paths-run.txt
          if-no-files-found: ignore
          retention-days: 90
