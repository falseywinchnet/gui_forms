name: GUI.Forms native platform
# One platform's native job: build, test, cache and evidence. native.yml calls it
# once per platform, so each platform's programs job (release.yml) can start as
# soon as its own native job passes instead of waiting for all four. Every
# github.* value (event, ref, sha, run) is the calling run's.
on:
  workflow_call:
    inputs:
      runner:
        type: string
        required: true
      platform:
        type: string
        required: true
      shell:
        type: string
        required: true
      force_validation:
        description: Run native validation even if an identical successful receipt exists
        type: boolean
        default: false
      package_windows_toolchain:
        description: Install and package a new Windows toolchain when none is published for the harness's windows_toolchain.json
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  # tools/ci_reuse.py finds a producer's job by this name: the calling job is
  # named "native (<runner>, <platform>, <shell>)", so the job reads
  # "native (<runner>, <platform>, <shell>) / build".
  build:
    runs-on: ${{ inputs.runner }}
    # A cold Windows build that also packages a new toolchain needs headroom.
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      GUI_FORMS_RUNNER: ${{ inputs.runner }}
      OBJCXX: clang++
      CC: clang
      CXX: clang++
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    defaults:
      run:
        shell: ${{ inputs.shell }}
    steps:
      # One tree per job: a pull_request run takes its workflow files from the
      # test merge commit (refs/pull/N/merge), so the job checks out that same
      # commit (the default ref), never the head alone, whose older tree may
      # lack tools main's workflow calls. A push or a merge group checks out
      # its own commit. A merge group's branch is temporary: it never promotes
      # (main only) and saves no Actions cache, and it reuses a pull request's
      # validation of the same tree (tools/ci_reuse.py), as main then reuses
      # the merge group's.
      - uses: actions/checkout@v4
        with:
          path: gui_forms
      # template_harness beside gui_forms, at the commit gui_forms/harness.lock
      # pins: the reuse, promotion, cache and toolchain tools
      # (docs/building/template-harness.md).
      - uses: ./gui_forms/.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find exact-tree validated archive before installing build tools
        id: promotion
        if: github.ref == 'refs/heads/main' && inputs.force_validation != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_promote.py lookup --platform "${{ inputs.platform }}"
      - uses: actions/download-artifact@v4
        if: steps.promotion.outputs.reused == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.promotion.outputs.producer-run }}
          artifact-ids: ${{ steps.promotion.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Promote validated bytes and preserve their producer identity
        if: steps.promotion.outputs.reused == 'true'
        shell: bash
        run: python template_harness/harness/ci_promote.py archive
      # Stdlib zstd packs and extracts the Windows toolchain; the build keeps its Python.
      - uses: actions/setup-python@v5
        id: toolchain-python
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
          update-environment: false
      - name: Fetch the Windows toolchain recorded by the promoted cache
        if: steps.promotion.outputs.reused == 'true' && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py fetch-recorded'
      - name: Restore the published Windows toolchain without MSYS2 mirrors
        id: toolchain
        if: steps.promotion.outputs.reused != 'true' && runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
          GUI_FORMS_PACKAGE_WINDOWS_TOOLCHAIN: ${{ inputs.package_windows_toolchain }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py restore'
      - name: Install macOS dependencies
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS')
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install cmake ninja ccache llvm@22
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"
      # The Ubuntu mirror is sometimes slow (7-11 minutes for 30 MB), so the
      # downloaded Ubuntu packages are kept in an Actions cache, refreshed once
      # per runner image; only main saves it (harness/install_linux_ci_packages.sh).
      - name: Name the Linux package cache
        id: linux-image
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: echo "image=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: linux-packages
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        with:
          path: ${{ runner.temp }}/apt-archives
          key: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-${{ steps.linux-image.outputs.image }}
          restore-keys: linux-debs-v1-toolkit-${{ runner.arch }}-${{ hashFiles('template_harness/harness/install_linux_ci_packages.sh', 'template_harness/projects/gui_forms.toml') }}-
      - name: Install Linux dependencies
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux')
        run: sh template_harness/harness/install_linux_ci_packages.sh toolkit "$RUNNER_TEMP/apt-archives"
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux') && github.event_name != 'pull_request' && github.event_name != 'merge_group' && steps.linux-packages.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/apt-archives
          key: ${{ steps.linux-packages.outputs.cache-primary-key }}
      # The MSYS2 mirrors carry only the current LLVM, so they are reached
      # only when a run dispatched with package_windows_toolchain finds no
      # published toolchain for the harness's windows_toolchain.json (a deliberate
      # specification change). Otherwise the restore step above fails with
      # ToolchainUnavailable, and packing refuses an LLVM the spec does not pin.
      - uses: msys2/setup-msys2@v2
        id: msys2
        if: steps.promotion.outputs.reused != 'true' && runner.os == 'Windows' && steps.toolchain.outputs.restored != 'true'
        with:
          msystem: CLANG64
          update: true
          path-type: inherit
          install: ${{ steps.toolchain.outputs.packages }}
      - name: Package the newly installed Windows toolchain before building
        id: toolchain-package
        if: steps.msys2.outcome == 'success'
        shell: bash
        env:
          TOOLCHAIN_PYTHON: ${{ steps.toolchain-python.outputs.python-path }}
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: '"$TOOLCHAIN_PYTHON" template_harness/harness/windows_toolchain.py pack --root "$MSYS2_LOCATION"'
      - uses: actions/upload-artifact@v4
        if: steps.toolchain-package.outcome == 'success'
        with:
          name: ${{ steps.toolchain-package.outputs.artifact-name }}
          overwrite: true
          path: |
            gui-forms-toolchain-windows-x64.tar.zst
            gui-forms-toolchain-windows-x64.json
          compression-level: 0
          retention-days: 30
      - name: Select macOS 14 runtime prefix
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS')
        run: echo "GUI_FORMS_LLVM_RUNTIME=$PWD/.build/toolchain/llvm-22.1.8-macos14" >> "$GITHUB_ENV"
      - name: Identify and verify LLVM release compiler
        if: steps.promotion.outputs.reused != 'true'
        id: compiler
        run: python template_harness/harness/compiler_identity.py
      - name: Fingerprint all tracked inputs and build environment
        if: steps.promotion.outputs.reused != 'true'
        id: inputs
        run: |
          python -B -m unittest discover -s template_harness/harness -p test_ci_reuse.py
          python template_harness/harness/ci_reuse.py identity --platform "${{ inputs.platform }}" --compiler "${{ steps.compiler.outputs.identity }}" --environment "${{ steps.compiler.outputs.environment }}"
      - uses: actions/upload-artifact@v4
        if: steps.promotion.outputs.reused != 'true'
        with:
          name: ${{ steps.inputs.outputs.inputs-name }}
          path: .ci/inputs.json
          include-hidden-files: true
          overwrite: true
          retention-days: 30
      - name: Reuse identical successful native validation
        id: reuse
        if: steps.promotion.outputs.reused != 'true' && (inputs.force_validation != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_reuse.py lookup
      - uses: actions/download-artifact@v4
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused == 'true')
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.reuse.outputs.producer-run }}
          artifact-ids: ${{ steps.reuse.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Verify and restore the validated cache payload
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused == 'true')
        run: python template_harness/harness/ci_reuse.py restore
      - name: Retain reused macOS runtimes in this branch cache
        uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused == 'true')
        with:
          path: .build/toolchain/llvm-22.1.8-macos14
          key: gui-runtimes-v1-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_macos_runtimes.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - uses: actions/cache@v4
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        with:
          path: .build/toolchain/llvm-22.1.8-macos14
          key: gui-runtimes-v1-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('template_harness/harness/build_macos_runtimes.py', 'template_harness/harness/macos_runtime_manifest.py') }}
      - name: Build minimum-compatible macOS runtimes
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        run: |
          if [ ! -f "$GUI_FORMS_LLVM_RUNTIME/runtime-manifest.json" ]; then
            python template_harness/harness/build_macos_runtimes.py --work "$RUNNER_TEMP/llvm-runtimes" --prefix "$GUI_FORMS_LLVM_RUNTIME" --jobs 4
          fi
          python template_harness/harness/macos_runtime_manifest.py "$GUI_FORMS_LLVM_RUNTIME"
          python template_harness/harness/audit_macos_minimum.py "$GUI_FORMS_LLVM_RUNTIME/lib"
      - name: Configure compiler cache
        if: steps.promotion.outputs.reused != 'true'
        run: |
          cache_dir="$PWD/.ccache"
          cache_base="$PWD"
          if command -v cygpath >/dev/null; then
            cache_dir="$(cygpath -m "$cache_dir")"
            cache_base="$(cygpath -m "$cache_base")"
          fi
          echo "CCACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$cache_base" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          # Before the cache is restored: tools/ci_cache.py evict keeps the
          # entries used after this moment.
          echo "GUI_FORMS_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        id: objects
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        with:
          path: .ccache
          key: gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ steps.inputs.outputs.tree }}
          restore-keys: |
            gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-
            gui-objects-v2-${{ inputs.platform }}-
      - uses: actions/cache/restore@v4
        id: dependencies
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        with:
          path: |
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native-${{ inputs.platform }}/gui-forms/_deps/gui_forms_miniaudio-src
          key: gui-deps-v3-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn', 'gui_forms/cmake/Audio.cmake') }}
          restore-keys: gui-deps-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ hashFiles('gui_forms/third_party/*.sh', 'gui_forms/third_party/*.patch', 'gui_forms/third_party/*.gn') }}
      - name: Find recent validated object seed across branches
        id: seed
        if: steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/ci_promote.py seed --platform "${{ inputs.platform }}"
      - uses: actions/download-artifact@v4
        if: steps.seed.outputs.seeded == 'true'
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.seed.outputs.producer-run }}
          artifact-ids: ${{ steps.seed.outputs.artifact-id }}
          path: .ci/download
          merge-multiple: true
      - name: Restore content-checked objects without reusing test results
        if: steps.seed.outputs.seeded == 'true'
        run: python template_harness/harness/ci_promote.py restore-seed
      # The engine gate test writes its manifest for the engine-gate job (T2 E11).
      - name: Build and test native toolkit
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        env:
          GUI_FORMS_ENGINE_GATE_MANIFEST: ${{ github.workspace }}/.ci/engine-gate-${{ inputs.platform }}.tsv
        run: |
          ccache --zero-stats
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" python gui_forms/tools/ci_build.py --jobs 4
          else
            python gui_forms/tools/ci_build.py --jobs 4
          fi
      - name: Prove one compression and PNG implementation in the link map
        if: steps.promotion.outputs.reused != 'true' && (steps.reuse.outputs.reused != 'true')
        run: |
          # Every static archive the toolkit links, stx_skia's among them: no C
          # zlib, FreeType gzip or libpng may remain (Z-stage I5, decision 3A).
          build=.build/native-${{ inputs.platform }}
          archives=$(find "$build/gui-forms" -name '*.a' -not -path '*/_deps/*' -not -name '*.dll.a')
          python gui_forms/tools/audit_link_map.py --forbid-foreign $archives
      - name: Test development text-mask ownership on Windows
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Windows' && steps.reuse.outputs.reused != 'true')
        shell: msys2 {0}
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
          if [ -f .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/LastTest.log ]; then
            cp .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/LastTest.log .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/SDKLastTest.log
          fi
          cmake -S gui_forms -B .build/native-${{ inputs.platform }}/gui-forms -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON -DGUI_FORMS_BUILD_TEXT_MASKS=ON -DGUI_FORMS_BUILD_PREPARED_TEXT=ON -DGUI_FORMS_BUILD_AUDIO_LOOP_TRANSPORT=ON
          cmake --build .build/native-${{ inputs.platform }}/gui-forms --target gui_forms_application_text_consumer gui_forms_text_mask_lifecycle_tests gui_forms_text_mask_native_tests gui_forms_text_mask_wrapping_tests gui_forms_linebreak_conformance_tests gui_forms_prepared_text_service_tests gui_forms_prepared_display_tests gui_forms_prepared_window_input_tests gui_forms_prepared_window_batch_tests gui_forms_prepared_window_shape_tests gui_forms_prepared_window_session_tests --parallel 4
          ctest --test-dir .build/native-${{ inputs.platform }}/gui-forms -R '^gui_forms_(application_text_(consumer|configure_accepted|configure_static_core)|text_mask_(lifecycle|native|wrapping)_tests|linebreak_conformance|prepared_text_service_tests|prepared_display_tests|prepared_window_(input|batch|shape|session)_tests)$' --output-on-failure
      - name: Test Windows DIB ownership and exact brush replay
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Windows' && steps.reuse.outputs.reused != 'true')
        shell: msys2 {0}
        run: |
          cp .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/LastTest.log .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/DevelopmentTextLastTest.log
          cmake -S gui_forms -B .build/native-${{ inputs.platform }}/gui-forms -DGUI_FORMS_WINDOWS_TRANSACTIONAL_DIB=ON
          cmake --build .build/native-${{ inputs.platform }}/gui-forms --target gui_forms_windows_dib_frame_store_tests gui_forms_windows_dib_lifecycle_tests --parallel 4
          ctest --test-dir .build/native-${{ inputs.platform }}/gui-forms -R '^gui_forms_windows_dib_(frame_store|lifecycle)_tests$' --output-on-failure
      - name: Test development text-mask ownership on macOS and Linux
        if: steps.promotion.outputs.reused != 'true' && (runner.os != 'Windows' && steps.reuse.outputs.reused != 'true')
        shell: bash
        run: |
          sh gui_forms/third_party/fetch_text_stack.sh
          sh gui_forms/third_party/fetch_linebreak.sh
          if [ -f .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/LastTest.log ]; then
            cp .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/LastTest.log .build/native-${{ inputs.platform }}/gui-forms/Testing/Temporary/SDKLastTest.log
          fi
          cmake -S gui_forms -B .build/native-${{ inputs.platform }}/gui-forms -DGUI_FORMS_ENABLE_HARFBUZZ_TEXT=ON -DGUI_FORMS_BUILD_TEXT_MASKS=ON -DGUI_FORMS_BUILD_PREPARED_TEXT=ON -DGUI_FORMS_BUILD_AUDIO_LOOP_TRANSPORT=ON
          cmake --build .build/native-${{ inputs.platform }}/gui-forms --target gui_forms_application_text_consumer gui_forms_text_mask_lifecycle_tests gui_forms_text_mask_native_tests gui_forms_text_mask_wrapping_tests gui_forms_linebreak_conformance_tests gui_forms_prepared_text_service_tests gui_forms_prepared_text_raster_tests gui_forms_prepared_display_tests gui_forms_prepared_text_skia_tests gui_forms_opaque_live_surface_raster_tests gui_forms_prepared_window_input_tests gui_forms_prepared_window_batch_tests gui_forms_prepared_window_shape_tests gui_forms_prepared_window_session_tests --parallel 4
          ctest --test-dir .build/native-${{ inputs.platform }}/gui-forms -R '^gui_forms_(application_text_(consumer|configure_accepted|configure_static_core)|text_mask_(lifecycle|native|wrapping)_tests|linebreak_conformance|prepared_text_(service|raster|skia)_tests|prepared_display_tests|opaque_live_surface_raster_tests|prepared_window_(input|batch|shape|session)_tests)$' --output-on-failure
      - name: Verify Linux prepared frames through X11
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'Linux' && steps.reuse.outputs.reused != 'true')
        run: |
          cmake --build .build/native-${{ inputs.platform }}/gui-forms --target gui_forms_linux_prepared_text_host_tests --parallel 4
          xvfb-run -a -s "-screen 0 1280x1024x24 -noreset" ctest --test-dir .build/native-${{ inputs.platform }}/gui-forms -R '^gui_forms_linux_prepared_text_host_tests$' --output-on-failure
      - name: Verify Mac prepared-frame native exposure and visibility
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        # Run after OFF diagnostics; development-only host rebuilding must not
        # change the binary used by the recorded baseline or exported SDK.
        run: |
          cmake --build .build/native-macos-arm64/gui-forms --target gui_forms_macos_exposure_tests gui_forms_macos_idle_visibility_tests gui_forms_macos_display_link_tests gui_forms_macos_prepared_text_host_tests --parallel 4
          ctest --test-dir .build/native-macos-arm64/gui-forms -R '^gui_forms_macos_(exposure|idle_visibility|display_link(_overlay)?|prepared_text_host)_tests$' --output-on-failure
      - name: Audit installed macOS binary minimums
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        run: python template_harness/harness/audit_macos_minimum.py .build/native-macos-arm64/gui-forms-sdk .build/native-macos-arm64/installed-reference-examples
      # Only main saves dependencies: a pull request's copy could be restored
      # by no other ref and held 0.5 GB of the 10 GB.
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && (always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.reuse.outputs.reused != 'true' && steps.dependencies.outputs.cache-primary-key != '' && steps.dependencies.outputs.cache-hit != 'true')
        with:
          path: |
            gui_forms/third_party/harfbuzz
            gui_forms/third_party/freetype
            gui_forms/third_party/libunibreak
            .build/native-${{ inputs.platform }}/gui-forms/_deps/gui_forms_miniaudio-src
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Report cache statistics
        if: steps.promotion.outputs.reused != 'true' && (always())
        run: ccache --show-stats --verbose
      # The saved cache, and the consumer archive below, hold this build's
      # working set, not every generation up to CCACHE_MAXSIZE
      # (notes:planning/BUILD_SIZE_PLAN_2026-10-23.md, step 1). On every event: a
      # native job builds everything (no change selection), so the set is
      # complete, and the archive the programs job, a stacked pull request's
      # seed and a consumer download is about 25 MB instead of 600. Only after
      # a build that passed; a job that reused a validation compiled nothing
      # and keeps its cache.
      - name: Keep only the compiler cache entries this build used
        if: success() && steps.promotion.outputs.reused != 'true' && steps.reuse.outputs.reused != 'true'
        run: python template_harness/harness/ci_cache.py evict --since "$GUI_FORMS_JOB_START"
      # Only main saves object caches: pull requests and merge groups seed
      # from validated archives (ci_promote.py seed), and their per-tree
      # entries evicted the dependency caches from the repository's 10 GB.
      - uses: actions/cache/save@v4
        if: steps.promotion.outputs.reused != 'true' && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (always() && (steps.reuse.outputs.reused == 'true' || (steps.objects.outputs.cache-primary-key != '' && steps.objects.outputs.cache-hit != 'true')))
        with:
          path: .ccache
          key: gui-objects-v2-${{ inputs.platform }}-${{ steps.compiler.outputs.identity }}-${{ steps.inputs.outputs.tree }}
      - name: Archive consumer cache seed
        if: steps.promotion.outputs.reused != 'true'
        run: |
          python template_harness/harness/cache_manifest.py "${{ inputs.platform }}" "${{ steps.compiler.outputs.identity }}"
          if [ "$RUNNER_OS" = macOS ]; then
            tar -czf gui-forms-cache-${{ inputs.platform }}.tar.gz .ccache cache-manifest.json .build/toolchain/llvm-22.1.8-macos14
          else
            tar -czf gui-forms-cache-${{ inputs.platform }}.tar.gz .ccache cache-manifest.json
          fi
      - name: Prove archived macOS runtimes after relocation
        if: steps.promotion.outputs.reused != 'true' && (runner.os == 'macOS' && steps.reuse.outputs.reused != 'true')
        run: python gui_forms/tools/prove_macos_runtime_restore.py --archive gui-forms-cache-macos-arm64.tar.gz --executable .build/native-macos-arm64/gui-forms/gui_forms_threading_tests
      - uses: actions/upload-artifact@v4
        id: cache-artifact
        with:
          name: gui-forms-cache-${{ inputs.platform }}
          overwrite: true
          path: gui-forms-cache-${{ inputs.platform }}.tar.gz
          compression-level: 0
          retention-days: 30
      - name: Record successful native validation and cache provenance
        id: receipt
        shell: bash
        run: python template_harness/harness/ci_reuse.py record --artifact-id "${{ steps.cache-artifact.outputs.artifact-id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.receipt.outputs.receipt-name }}
          path: .ci/receipt.json
          include-hidden-files: true
          overwrite: true
          retention-days: 30
      # A job that promoted (a push to main) or reused an exact-tree
      # validation ran no test, so it has no engine gate manifest of its own:
      # it carries the validation run's manifest for the same tree, so the
      # engine-gate job compares every host (tools/engine_gate.py carry).
      - name: Carry the validation run's engine gate manifest
        if: always() && (steps.promotion.outputs.reused == 'true' || steps.reuse.outputs.reused == 'true')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python gui_forms/tools/engine_gate.py carry --platform "${{ inputs.platform }}" --state .ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gui-forms-evidence-${{ inputs.platform }}
          include-hidden-files: true
          overwrite: true
          path: |
            .build/native-${{ inputs.platform }}/**/Testing/Temporary/*LastTest.log
            .ci/*.json
            .ci/engine-gate-*.tsv
      - name: Publish this passing platform immediately
        # Only a push to main publishes. The daily schedule rebuilds a commit
        # main already published, and publish_cache.py refuses different bytes.
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/publish_cache.py --platform "${{ inputs.platform }}"
