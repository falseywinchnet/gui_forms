name: Layout oracle
# Regenerates the layout corpus references with the pinned Chromium headless
# shell and checks that they still match the checked-in ones within one
# LayoutUnit (notes:planning/stages/L-layout/PLAN.md section 6.3; owner decisions
# L-Q10 and L-Q11). Chromium is a test oracle only and never reaches
# GUI.Forms. This job is not a required check; the corpus itself is tested on
# every host by gui_forms_layout_corpus_tests without Chromium.
on:
  pull_request:
    paths:
      - 'tests/layout_corpus/**'
      - 'tools/layout_oracle/**'
      - 'assets/fonts/**'
      - '.github/workflows/layout-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'tests/layout_corpus/**'
      - 'tools/layout_oracle/**'
      - 'assets/fonts/**'
      - '.github/workflows/layout-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: layout-oracle-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  layout-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Read the Chromium pin
        id: pin
        run: |
          python3 -c "import json; p = json.load(open('tools/layout_oracle/chromium_pin.json')); print('version=' + p['version']); print('sha256=' + p['packages']['linux64']['sha256'])" >> "$GITHUB_OUTPUT"
      - name: Restore the pinned Chromium archive
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromium-download
          key: chromium-headless-shell-linux64-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}
      - name: Fetch and verify Chromium
        run: |
          if [ -f "$RUNNER_TEMP/chromium-download/chrome-headless-shell-linux64.zip" ]; then
            source="--archive $RUNNER_TEMP/chromium-download/chrome-headless-shell-linux64.zip"
          else
            source="--download $RUNNER_TEMP/chromium-download"
          fi
          python3 -B tools/layout_oracle/fetch_chromium.py --platform linux64 --approved \
            $source --unpack "$RUNNER_TEMP/chromium" | tee "$RUNNER_TEMP/fetch.txt"
          echo "CHROMIUM=$(tail -n 1 "$RUNNER_TEMP/fetch.txt")" >> "$GITHUB_ENV"
      - name: Oracle tool tests
        run: python3 -B -m unittest discover -s tools/layout_oracle -p test_layout_oracle.py
      - name: Regenerate the references
        run: |
          python3 -B tools/layout_oracle/capture.py --chromium "$CHROMIUM" --no-sandbox \
            --corpus tests/layout_corpus --output "$RUNNER_TEMP/references" --platform linux64
      - name: Check drift against the checked-in references
        run: |
          python3 -B tools/layout_oracle/compare.py drift --corpus tests/layout_corpus \
            --regenerated "$RUNNER_TEMP/references"
      - name: Keep the regenerated references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-oracle-references
          path: ${{ runner.temp }}/references
          if-no-files-found: ignore
